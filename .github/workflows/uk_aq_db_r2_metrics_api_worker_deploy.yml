name: Deploy uk_aq_db_r2_metrics_api Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_db_size_metrics_api_worker/**"
      - "workers/shared/r2_sigv4.mjs"
      - "workers/shared/uk_aq_r2_history_index.mjs"
      - "workers/shared/uk_aq_observation_history_generation.mjs"
      - ".github/workflows/uk_aq_db_r2_metrics_api_worker_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      UK_AQ_DB_R2_METRICS_API_WORKER_NAME: ${{ vars.UK_AQ_DB_R2_METRICS_API_WORKER_NAME }}
      UK_AQ_R2_CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_R2_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UK_AQ_ENV_NAME: ${{ vars.UK_AQ_ENV_NAME }}
      UK_AQ_GITHUB_REPO: ${{ vars.UK_AQ_GITHUB_REPO }}
      UK_AQ_R2_HISTORY_VERSION: ${{ vars.UK_AQ_R2_HISTORY_VERSION || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup patched Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Validate deployment target and required bindings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          OBS_AQIDB_SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
          OBS_AQIDB_SECRET_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
          CFLARE_R2_ENDPOINT: ${{ vars.CFLARE_R2_ENDPOINT }}
          CFLARE_R2_BUCKET: ${{ vars.CFLARE_R2_BUCKET }}
          CFLARE_R2_REGION: ${{ vars.CFLARE_R2_REGION }}
          CFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CFLARE_R2_ACCESS_KEY_ID }}
          CFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CFLARE_R2_SECRET_ACCESS_KEY }}
          UK_AQ_DB_SIZE_API_TOKEN: ${{ secrets.UK_AQ_DB_SIZE_API_TOKEN }}
        run: python3 scripts/deploy/validate_db_r2_metrics_target.py

      - name: Deploy Worker (base)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.UK_AQ_R2_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/uk_aq_db_size_metrics_api_worker
          command: deploy --name ${{ env.UK_AQ_DB_R2_METRICS_API_WORKER_NAME }}

      - name: Set Worker secrets
        working-directory: workers/uk_aq_db_size_metrics_api_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.UK_AQ_R2_CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          OBS_AQIDB_SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
          OBS_AQIDB_SECRET_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
          CFLARE_R2_ENDPOINT: ${{ vars.CFLARE_R2_ENDPOINT }}
          CFLARE_R2_BUCKET: ${{ vars.CFLARE_R2_BUCKET }}
          CFLARE_R2_REGION: ${{ vars.CFLARE_R2_REGION }}
          CFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CFLARE_R2_ACCESS_KEY_ID }}
          CFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CFLARE_R2_SECRET_ACCESS_KEY }}
          UK_AQ_DB_SIZE_API_TOKEN: ${{ secrets.UK_AQ_DB_SIZE_API_TOKEN }}
        run: |
          set -euo pipefail
          secrets_json="$(jq -n \
            --arg SUPABASE_URL "${SUPABASE_URL}" \
            --arg SB_SECRET_KEY "${SB_SECRET_KEY}" \
            --arg OBS_AQIDB_SUPABASE_URL "${OBS_AQIDB_SUPABASE_URL}" \
            --arg OBS_AQIDB_SECRET_KEY "${OBS_AQIDB_SECRET_KEY}" \
            --arg CFLARE_R2_ENDPOINT "${CFLARE_R2_ENDPOINT}" \
            --arg CFLARE_R2_BUCKET "${CFLARE_R2_BUCKET}" \
            --arg CFLARE_R2_REGION "${CFLARE_R2_REGION}" \
            --arg CFLARE_R2_ACCESS_KEY_ID "${CFLARE_R2_ACCESS_KEY_ID}" \
            --arg CFLARE_R2_SECRET_ACCESS_KEY "${CFLARE_R2_SECRET_ACCESS_KEY}" \
            --arg UK_AQ_R2_HISTORY_VERSION "${UK_AQ_R2_HISTORY_VERSION}" \
            --arg UK_AQ_DB_SIZE_API_TOKEN "${UK_AQ_DB_SIZE_API_TOKEN}" \
            '{SUPABASE_URL: $SUPABASE_URL, SB_SECRET_KEY: $SB_SECRET_KEY, OBS_AQIDB_SUPABASE_URL: $OBS_AQIDB_SUPABASE_URL, OBS_AQIDB_SECRET_KEY: $OBS_AQIDB_SECRET_KEY, CFLARE_R2_ENDPOINT: $CFLARE_R2_ENDPOINT, CFLARE_R2_BUCKET: $CFLARE_R2_BUCKET, CFLARE_R2_REGION: $CFLARE_R2_REGION, CFLARE_R2_ACCESS_KEY_ID: $CFLARE_R2_ACCESS_KEY_ID, CFLARE_R2_SECRET_ACCESS_KEY: $CFLARE_R2_SECRET_ACCESS_KEY, UK_AQ_R2_HISTORY_VERSION: $UK_AQ_R2_HISTORY_VERSION, UK_AQ_DB_SIZE_API_TOKEN: $UK_AQ_DB_SIZE_API_TOKEN} | with_entries(select(.value != ""))')"
          for attempt in 1 2 3; do
            if printf "%s" "$secrets_json" | npx --yes wrangler@4 secret bulk --name "${UK_AQ_DB_R2_METRICS_API_WORKER_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to apply Worker secrets after 3 attempts."
              latest_log="$(ls -1t "${HOME}/.config/.wrangler/logs"/wrangler-*.log 2>/dev/null | head -n 1 || true)"
              if [ -n "${latest_log}" ] && [ -f "${latest_log}" ]; then
                echo "Last Wrangler log: ${latest_log}"
                sed -n '1,200p' "${latest_log}" || true
              fi
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.UK_AQ_R2_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/uk_aq_db_size_metrics_api_worker
          command: deploy --name ${{ env.UK_AQ_DB_R2_METRICS_API_WORKER_NAME }}
