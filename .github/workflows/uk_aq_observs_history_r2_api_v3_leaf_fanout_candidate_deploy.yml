name: Deploy observation-history leaf fan-out candidate Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-leaf-fanout-candidate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_R2_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_R2_CLOUDFLARE_API_TOKEN || '' }}
      UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME: ${{ vars.UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
      - run: npm ci
      - name: Validate isolated TEST fan-out configuration
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing UK_AQ_R2_CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing UK_AQ_R2_CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "${UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME}" || { echo "Missing UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME."; exit 1; }
          case "${UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME}" in
            *[!a-z0-9-]*|-*|*-|*-v3-leaf-candidate|*-v3-leaf-fanout-candidate|*[Ll][Ii][Vv][Ee]*) echo "Base Worker name is invalid or not isolated from LIVE."; exit 1 ;;
          esac
          test "${#UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME}" -le 38 || { echo "Base Worker name is too long for the fan-out candidate suffix."; exit 1; }
          printf 'PHYSICAL_LEAF_CANDIDATE_WORKER_NAME=%s-v3-leaf-candidate\n' "${UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME}" >> "${GITHUB_ENV}"
          printf 'LEAF_FANOUT_CANDIDATE_WORKER_NAME=%s-v3-leaf-fanout-candidate\n' "${UK_AQ_OBSERVS_HISTORY_R2_API_WORKER_NAME}" >> "${GITHUB_ENV}"
          test -n "${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}" || { echo "Missing UK_AQ_EDGE_UPSTREAM_SECRET."; exit 1; }
      - name: Fix Service Binding to the existing physical-leaf candidate
        working-directory: workers/uk_aq_observs_history_r2_api_v3_leaf_fanout_candidate
        run: |
          set -euo pipefail
          sed "s|__UK_AQ_PHYSICAL_LEAF_CANDIDATE_WORKER_NAME__|${PHYSICAL_LEAF_CANDIDATE_WORKER_NAME}|g" wrangler.toml > wrangler.deploy.toml
          grep -F 'UKAQ_ENV_NAME = "TEST"' wrangler.deploy.toml >/dev/null
          grep -F 'workers_dev = true' wrangler.deploy.toml >/dev/null
          grep -F 'preview_urls = false' wrangler.deploy.toml >/dev/null
          grep -F 'UK_AQ_R2_HISTORY_INDEX_VERSION = "v3-physical-leaf-fanout-candidate"' wrangler.deploy.toml >/dev/null
          grep -F 'binding = "PHYSICAL_LEAF"' wrangler.deploy.toml >/dev/null
          grep -F "service = \"${PHYSICAL_LEAF_CANDIDATE_WORKER_NAME}\"" wrangler.deploy.toml >/dev/null
          ! grep -F '__UK_AQ_PHYSICAL_LEAF_CANDIDATE_WORKER_NAME__' wrangler.deploy.toml >/dev/null
          ! grep -E '\[\[r2_buckets\]\]|UK_AQ_HISTORY_BUCKET|history/v2/observations|history/_index_v3/observations_timeseries' wrangler.deploy.toml >/dev/null
      - name: Reuse existing upstream-auth secret
        working-directory: workers/uk_aq_observs_history_r2_api_v3_leaf_fanout_candidate
        run: |
          set -euo pipefail
          jq -n --arg UK_AQ_EDGE_UPSTREAM_SECRET "${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}" \
            '{UK_AQ_EDGE_UPSTREAM_SECRET:$UK_AQ_EDGE_UPSTREAM_SECRET}' \
            | npx --yes wrangler@4 secret bulk --config wrangler.deploy.toml --name "${LEAF_FANOUT_CANDIDATE_WORKER_NAME}"
      - name: Deploy non-authoritative leaf fan-out candidate
        working-directory: workers/uk_aq_observs_history_r2_api_v3_leaf_fanout_candidate
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.toml --name "${LEAF_FANOUT_CANDIDATE_WORKER_NAME}"
