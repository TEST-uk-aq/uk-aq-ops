name: Configure UK AQ Blog Phase 2 (TEST)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/uk_aq_blog_phase2_configure_test.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
      GH_ADMIN_TOKEN: ${{ secrets.UK_AQ_GITHUB_WORKFLOW_DISPATCH_PAT || '' }}
      KV_TITLE: uk-aq-blog-feed-test
      WORKER_NAME: uk-aq-blog-feed-test
      OPS_REPO: TEST-uk-aq/uk-aq-ops
      WEBSITE_REPO: TEST-uk-aq/TEST-uk-aq.github.io

    steps:
      - name: Validate existing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GH_ADMIN_TOKEN"

      - name: Create or reuse TEST Blog KV namespace
        id: kv
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl --fail-with-body --silent --show-error "${AUTH[@]}" "$API?per_page=100" > "$RUNNER_TEMP/kv-list.json"

          python3 - "$RUNNER_TEMP/kv-list.json" "$KV_TITLE" > "$RUNNER_TEMP/kv-existing.txt" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare KV list did not report success")
          matches=[row for row in payload.get("result", []) if row.get("title")==sys.argv[2]]
          if len(matches)>1:
              raise SystemExit(f"Multiple KV namespaces named {sys.argv[2]!r}")
          if matches:
              print(matches[0]["id"])
          PY

          KV_ID="$(cat "$RUNNER_TEMP/kv-existing.txt")"
          if [ -z "$KV_ID" ]; then
            jq -n --arg title "$KV_TITLE" '{title:$title}' > "$RUNNER_TEMP/kv-create.json"
            curl --fail-with-body --silent --show-error -X POST "${AUTH[@]}" \
              --data-binary @"$RUNNER_TEMP/kv-create.json" "$API" > "$RUNNER_TEMP/kv-created.json"
            KV_ID="$(python3 - "$RUNNER_TEMP/kv-created.json" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare KV create did not report success")
          result=payload.get("result") or {}
          value=result.get("id")
          if not isinstance(value,str) or len(value)!=32:
              raise SystemExit("Cloudflare KV create returned an invalid namespace id")
          print(value)
          PY
            )"
            echo "Created dedicated TEST Blog KV namespace."
          else
            echo "Reusing existing dedicated TEST Blog KV namespace."
          fi

          if ! [[ "$KV_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Invalid KV namespace id."
            exit 1
          fi
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve TEST workers.dev URL
        id: worker_url
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            > "$RUNNER_TEMP/workers-subdomain.json"

          SUBDOMAIN="$(python3 - "$RUNNER_TEMP/workers-subdomain.json" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare workers subdomain lookup did not report success")
          result=payload.get("result") or {}
          value=result.get("subdomain")
          if not isinstance(value,str) or not value.strip():
              raise SystemExit("Cloudflare workers subdomain is missing")
          print(value.strip())
          PY
          )"

          FEED_URL="https://$WORKER_NAME.$SUBDOMAIN.workers.dev/feed"
          echo "feed_url=$FEED_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved Blog feed URL: $FEED_URL"

      - name: Configure GitHub variables and shared secret
        shell: bash
        env:
          GH_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
          KV_ID: ${{ steps.kv.outputs.kv_id }}
          FEED_URL: ${{ steps.worker_url.outputs.feed_url }}
        run: |
          set -euo pipefail

          SHARED_SECRET="$(openssl rand -hex 32)"
          test "${#SHARED_SECRET}" -eq 64

          gh variable set UK_AQ_BLOG_FEED_WORKER_NAME --repo "$OPS_REPO" --body "$WORKER_NAME"
          gh variable set UK_AQ_BLOG_FEED_KV_ID --repo "$OPS_REPO" --body "$KV_ID"

          printf '%s' "$SHARED_SECRET" | gh secret set UK_AQ_BLOG_WORKER_HTTP_SECRET --repo "$OPS_REPO"

          gh variable set UK_AQ_BLOG_FEED_URL --repo "$WEBSITE_REPO" --body "$FEED_URL"
          printf '%s' "$SHARED_SECRET" | gh secret set UK_AQ_BLOG_WORKER_HTTP_SECRET --repo "$WEBSITE_REPO"

          unset SHARED_SECRET

          echo "Configured:"
          echo "  $OPS_REPO variable UK_AQ_BLOG_FEED_WORKER_NAME=$WORKER_NAME"
          echo "  $OPS_REPO variable UK_AQ_BLOG_FEED_KV_ID=$KV_ID"
          echo "  $OPS_REPO secret UK_AQ_BLOG_WORKER_HTTP_SECRET"
          echo "  $WEBSITE_REPO variable UK_AQ_BLOG_FEED_URL=$FEED_URL"
          echo "  $WEBSITE_REPO secret UK_AQ_BLOG_WORKER_HTTP_SECRET"

      - name: Verify non-secret GitHub configuration
        shell: bash
        env:
          GH_TOKEN: ${{ env.GH_ADMIN_TOKEN }}
          EXPECTED_KV_ID: ${{ steps.kv.outputs.kv_id }}
          EXPECTED_FEED_URL: ${{ steps.worker_url.outputs.feed_url }}
        run: |
          set -euo pipefail
          ACTUAL_WORKER="$(gh variable get UK_AQ_BLOG_FEED_WORKER_NAME --repo "$OPS_REPO")"
          ACTUAL_KV="$(gh variable get UK_AQ_BLOG_FEED_KV_ID --repo "$OPS_REPO")"
          ACTUAL_FEED="$(gh variable get UK_AQ_BLOG_FEED_URL --repo "$WEBSITE_REPO")"

          test "$ACTUAL_WORKER" = "$WORKER_NAME"
          test "$ACTUAL_KV" = "$EXPECTED_KV_ID"
          test "$ACTUAL_FEED" = "$EXPECTED_FEED_URL"

          echo "Non-secret Blog Phase 2 TEST configuration verified."
