name: One-off fix freshness connector width
# One-off TEST dashboard correction.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff_fix_freshness_connector_width.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilise freshness connector column width
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dashboard/index.html")
          text = path.read_text(encoding="utf-8")
          old = '''      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .table-scroll {
'''
          new = '''      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .freshness-table thead th:first-child,
      .freshness-table tbody tr:not(.freshness-mobile-trend-row) > td:first-child {
        width: 31%;
      }

      .table-scroll {
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"{path}: expected exactly one table CSS anchor, found {count}")
          updated = text.replace(old, new, 1)
          if updated.count('width: 31%;') != 1:
              raise SystemExit(f"{path}: freshness connector width insertion verification failed")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Structural checks
        run: |
          set -euo pipefail
          git diff --check
          grep -F '.freshness-table thead th:first-child,' dashboard/index.html
          grep -F 'width: 31%;' dashboard/index.html

      - name: Commit correction and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git rm .github/workflows/oneoff_fix_freshness_connector_width.yml
          git commit -m "Stabilise freshness table connector width"
          git push origin HEAD:main
