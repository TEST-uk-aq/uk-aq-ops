name: TEST JSONgen signer isolated R2 bundle transport

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_r2_write:
        description: 'Explicitly allow one small immutable synthetic R2 object and protocol checks (no Prune or SQL)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uk-aq-jsongen-signer-bundle-transport-test
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'TEST-uk-aq/uk-aq-ops' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_isolated_r2_write == true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      UK_AQ_ENV_NAME: TEST
      UK_AQ_JSONGEN_ISOLATED_R2_WRITE_CONFIRMED: 'true'
      UK_AQ_JSONGEN_PRUNE_SIGNER_URL: ${{ vars.UK_AQ_JSONGEN_PRUNE_SIGNER_URL }}
      UK_AQ_JSONGEN_R2_ENDPOINT: ${{ vars.UK_AQ_JSONGEN_R2_ENDPOINT }}
      UK_AQ_JSONGEN_R2_BUCKET: ${{ vars.UK_AQ_JSONGEN_R2_BUCKET }}

    steps:
      - name: Checkout TEST main
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate isolated acceptance script syntax
        run: node --check scripts/jsongen/check-signer-bundle-r2-transport.mjs

      - name: Exercise real TEST R2 signed bundle transport only
        env:
          UK_AQ_JSONGEN_SIGNER_ACCESS_CLIENT_ID: ${{ secrets.UK_AQ_JSONGEN_SIGNER_ACCESS_CLIENT_ID }}
          UK_AQ_JSONGEN_SIGNER_ACCESS_CLIENT_SECRET: ${{ secrets.UK_AQ_JSONGEN_SIGNER_ACCESS_CLIENT_SECRET }}
          UK_AQ_JSONGEN_PRUNE_WRITER_TOKEN: ${{ secrets.UK_AQ_JSONGEN_PRUNE_WRITER_TOKEN }}
        run: node scripts/jsongen/check-signer-bundle-r2-transport.mjs
