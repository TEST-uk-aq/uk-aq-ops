name: UK AQ R2 History Dropbox Backup

on:
  # Intended external schedule:
  #   04:35 UTC daily via Cloudflare Worker
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing Dropbox copy/checkpoint/prune changes"
        required: false
        default: false
        type: boolean
      max_days_per_run:
        description: "Override max observation days copied per run (0 = unlimited)"
        required: false
        default: ""
        type: string
      force_prune_recheck:
        description: "Audit all current observation days for stale Dropbox Parquet"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: uk-aq-r2-history-dropbox-backup
  cancel-in-progress: false

jobs:
  backup-r2-history-to-dropbox:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CFLARE_R2_ENDPOINT: ${{ vars.CFLARE_R2_ENDPOINT || '' }}
      CFLARE_R2_BUCKET: ${{ vars.CFLARE_R2_BUCKET || '' }}
      CFLARE_R2_REGION: ${{ vars.CFLARE_R2_REGION || 'auto' }}
      CFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CFLARE_R2_ACCESS_KEY_ID }}
      CFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CFLARE_R2_SECRET_ACCESS_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}

      UK_AQ_R2_HISTORY_V2_OBSERVATIONS_PREFIX: ${{ vars.UK_AQ_R2_HISTORY_V2_OBSERVATIONS_PREFIX || 'history/v2/observations' }}
      UK_AQ_R2_HISTORY_V2_RUNS_PREFIX: ${{ vars.UK_AQ_R2_HISTORY_V2_RUNS_PREFIX || 'history/v2/_ops/observations/runs' }}
      UK_AQ_R2_HISTORY_V2_CORE_PREFIX: ${{ vars.UK_AQ_R2_HISTORY_V2_CORE_PREFIX || 'history/v2/core' }}
      UK_AQ_R2_HISTORY_INDEX_V2_PREFIX: ${{ vars.UK_AQ_R2_HISTORY_INDEX_V2_PREFIX || 'history/_index_v2' }}
      UK_AQ_R2_HISTORY_INDEX_VERSION: ${{ vars.UK_AQ_R2_HISTORY_INDEX_VERSION || '' }}
      UK_AQ_R2_HISTORY_TIMESERIES_BINDING_V2_PREFIX: ${{ vars.UK_AQ_R2_HISTORY_TIMESERIES_BINDING_V2_PREFIX || 'history/_index_v2/timeseries_binding' }}
      UK_AQ_R2_HISTORY_HIERARCHICAL_INVENTORY_PREFIX: ${{ vars.UK_AQ_R2_HISTORY_HIERARCHICAL_INVENTORY_PREFIX || 'history/_index_v2/backup_inventory_v2' }}
      UK_AQ_R2_HISTORY_HIERARCHICAL_STATE_PREFIX: ${{ vars.UK_AQ_R2_HISTORY_HIERARCHICAL_STATE_PREFIX || '_ops/checkpoints/r2_history_backup_state_v2' }}

      UK_AQ_R2_HISTORY_BACKUP_MAX_DAYS_PER_RUN: ${{ vars.UK_AQ_R2_HISTORY_BACKUP_MAX_DAYS_PER_RUN || '0' }}
      UK_AQ_R2_HISTORY_CHECKPOINT_BATCH_UNITS: ${{ vars.UK_AQ_R2_HISTORY_CHECKPOINT_BATCH_UNITS || '10' }}
      UK_AQ_R2_HISTORY_CHECKPOINT_FLUSH_SECONDS: ${{ vars.UK_AQ_R2_HISTORY_CHECKPOINT_FLUSH_SECONDS || '60' }}
      UK_AQ_DROPBOX_ROOT: ${{ vars.UK_AQ_DROPBOX_ROOT || 'TEST' }}
      UK_AQ_R2_HISTORY_DROPBOX_DIR: ${{ vars.UK_AQ_R2_HISTORY_DROPBOX_DIR || 'R2_history_backup' }}

      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      INPUT_MAX_DAYS_PER_RUN: ${{ github.event.inputs.max_days_per_run || '' }}
      INPUT_FORCE_PRUNE_RECHECK: ${{ github.event.inputs.force_prune_recheck || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Report daily task health (started)
        id: daily_task_health_started
        env:
          SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
          DAILY_TASK_KEY: ops.r2_history_dropbox_backup
          DAILY_TASK_HEALTH_REPORT_STAGE: started
        run: node scripts/report_daily_task_health.mjs

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Validate required configuration
        run: |
          set -euo pipefail
          required_vars=(
            CFLARE_R2_ENDPOINT
            CFLARE_R2_BUCKET
            CFLARE_R2_ACCESS_KEY_ID
            CFLARE_R2_SECRET_ACCESS_KEY
            SUPABASE_DB_URL
            DROPBOX_APP_KEY
            DROPBOX_APP_SECRET
            DROPBOX_REFRESH_TOKEN
            UK_AQ_DROPBOX_ROOT
            UK_AQ_R2_HISTORY_DROPBOX_DIR
            UK_AQ_R2_HISTORY_V2_OBSERVATIONS_PREFIX
            UK_AQ_R2_HISTORY_V2_RUNS_PREFIX
            UK_AQ_R2_HISTORY_V2_CORE_PREFIX
            UK_AQ_R2_HISTORY_TIMESERIES_BINDING_V2_PREFIX
            UK_AQ_R2_HISTORY_HIERARCHICAL_INVENTORY_PREFIX
            UK_AQ_R2_HISTORY_HIERARCHICAL_STATE_PREFIX
          )

          missing=0
          for key in "${required_vars[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required value: ${key}" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          case "${UK_AQ_R2_HISTORY_BACKUP_MAX_DAYS_PER_RUN}" in
            ''|*[!0-9]*)
              echo "UK_AQ_R2_HISTORY_BACKUP_MAX_DAYS_PER_RUN must be a non-negative integer." >&2
              exit 1
              ;;
          esac

      - name: Configure rclone remotes
        env:
          RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
        run: |
          set -euo pipefail

          endpoint="${CFLARE_R2_ENDPOINT%/}"
          dropbox_access_token="$(curl -fsS https://api.dropbox.com/oauth2/token \
            -u "${DROPBOX_APP_KEY}:${DROPBOX_APP_SECRET}" \
            -d grant_type=refresh_token \
            --data-urlencode "refresh_token=${DROPBOX_REFRESH_TOKEN}" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("access_token",""))')"

          if [ -z "${dropbox_access_token}" ]; then
            echo "Failed to fetch Dropbox access token from refresh token" >&2
            exit 1
          fi

          dropbox_token="$(DROPBOX_ACCESS_TOKEN="${dropbox_access_token}" DROPBOX_REFRESH_TOKEN="${DROPBOX_REFRESH_TOKEN}" python3 -c 'import json, os; print(json.dumps({"access_token": os.environ["DROPBOX_ACCESS_TOKEN"], "token_type": "bearer", "refresh_token": os.environ["DROPBOX_REFRESH_TOKEN"], "expiry": "0001-01-01T00:00:00Z"}, separators=(",", ":")))')"

          mkdir -p "$(dirname "${RCLONE_CONFIG}")"
          {
            echo "[uk_aq_r2]"
            echo "type = s3"
            echo "provider = Cloudflare"
            echo "env_auth = false"
            echo "access_key_id = ${CFLARE_R2_ACCESS_KEY_ID}"
            echo "secret_access_key = ${CFLARE_R2_SECRET_ACCESS_KEY}"
            echo "endpoint = ${endpoint}"
            echo "region = ${CFLARE_R2_REGION}"
            echo "acl = private"
            echo "no_check_bucket = true"
            echo
            echo "[uk_aq_dropbox]"
            echo "type = dropbox"
            echo "client_id = ${DROPBOX_APP_KEY}"
            echo "client_secret = ${DROPBOX_APP_SECRET}"
            echo "token = ${dropbox_token}"
          } > "${RCLONE_CONFIG}"

          chmod 600 "${RCLONE_CONFIG}"
          echo "RCLONE_CONFIG=${RCLONE_CONFIG}" >> "$GITHUB_ENV"

      - name: Run locked hierarchical Dropbox backup
        # The retained PostgreSQL session lock spans source-root inventory
        # selection, copy/verification and checkpoint-root publication.
        run: |
          set -euo pipefail
          mkdir -p tmp

          case "${UK_AQ_R2_HISTORY_INDEX_VERSION}" in
            v2|v3) ;;
            *)
              echo "UK_AQ_R2_HISTORY_INDEX_VERSION must be exactly v2 or v3" >&2
              exit 1
              ;;
          esac

          max_days="${INPUT_MAX_DAYS_PER_RUN:-}"
          if [ -z "${max_days}" ]; then
            max_days="${UK_AQ_R2_HISTORY_BACKUP_MAX_DAYS_PER_RUN}"
          fi
          case "${max_days}" in
            ''|*[!0-9]*)
              echo "max_days_per_run must be a non-negative integer" >&2
              exit 1
              ;;
          esac

          dropbox_root="${UK_AQ_DROPBOX_ROOT%/}"
          dropbox_root="${dropbox_root#/}"
          dropbox_dir="${UK_AQ_R2_HISTORY_DROPBOX_DIR#/}"
          dropbox_dir="${dropbox_dir%/}"
          if [ -z "${dropbox_dir}" ]; then
            echo "UK_AQ_R2_HISTORY_DROPBOX_DIR must not be empty" >&2
            exit 1
          fi

          if [ -n "${dropbox_root}" ]; then
            dropbox_backup_root="${dropbox_root}/${dropbox_dir}"
          else
            dropbox_backup_root="${dropbox_dir}"
          fi

          cmd=(
            node scripts/operations/uk_aq_with_observations_global_operation_lock.mjs
            --owner r2_history_dropbox_backup
            --run-id "r2-history-dropbox-backup:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            --
            node scripts/backup_r2/uk_aq_run_locked_history_backup.mjs
            --source-root "uk_aq_r2:${CFLARE_R2_BUCKET}"
            --dest-root "uk_aq_dropbox:${dropbox_backup_root}"
            --observations-prefix "${UK_AQ_R2_HISTORY_V2_OBSERVATIONS_PREFIX}"
            --runs-prefix "${UK_AQ_R2_HISTORY_V2_RUNS_PREFIX}"
            --core-prefix "${UK_AQ_R2_HISTORY_V2_CORE_PREFIX}"
            --timeseries-binding-prefix "${UK_AQ_R2_HISTORY_TIMESERIES_BINDING_V2_PREFIX}"
            --history-index-version "${UK_AQ_R2_HISTORY_INDEX_VERSION}"
            --inventory-root-prefix "${UK_AQ_R2_HISTORY_HIERARCHICAL_INVENTORY_PREFIX}"
            --state-root-prefix "${UK_AQ_R2_HISTORY_HIERARCHICAL_STATE_PREFIX}"
            --max-days-per-run "${max_days}"
            --checkpoint-batch-units "${UK_AQ_R2_HISTORY_CHECKPOINT_BATCH_UNITS}"
            --checkpoint-flush-seconds "${UK_AQ_R2_HISTORY_CHECKPOINT_FLUSH_SECONDS}"
            --inventory-report-out "tmp/r2_backup_inventory_report.json"
            --backup-report-out "tmp/r2_history_dropbox_backup_report.json"
          )

          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            cmd+=(--dry-run)
          fi
          if [ "${INPUT_FORCE_PRUNE_RECHECK}" = "true" ]; then
            cmd+=(--force-prune-recheck)
          fi

          echo "Running: ${cmd[*]}"
          "${cmd[@]}"

      - name: Upload backup report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-aq-r2-history-dropbox-backup-report
          path: |
            tmp/r2_backup_inventory_report.json
            tmp/r2_history_dropbox_backup_report.json
          if-no-files-found: ignore

      - name: Build daily task health supplemental summary
        if: always()
        continue-on-error: true
        run: |
          node scripts/backup_r2/build_history_backup_task_summary.mjs \
            --inventory-report "tmp/r2_backup_inventory_report.json" \
            --backup-report "tmp/r2_history_dropbox_backup_report.json" \
            --output "tmp/r2_history_dropbox_backup_task_summary.json"

      - name: Report daily task health
        if: always()
        env:
          SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
          DAILY_TASK_KEY: ops.r2_history_dropbox_backup
          DAILY_TASK_HEALTH_REPORT_STAGE: final
          DAILY_TASK_HEALTH_RUN_ID: ${{ steps.daily_task_health_started.outputs.health_run_id }}
          DAILY_TASK_HEALTH_SUPPLEMENTAL_SUMMARY_FILE: tmp/r2_history_dropbox_backup_task_summary.json
          JOB_STATUS: ${{ job.status }}
        run: node scripts/report_daily_task_health.mjs
