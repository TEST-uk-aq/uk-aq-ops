name: UK AQ Daily Task Health Structural Check

on:
  push:
    branches:
      - main
    paths:
      - "scripts/daily_task_health_email.py"
      - ".github/workflows/uk_aq_daily_task_health_email.yml"
      - ".github/workflows/uk_aq_daily_task_health_structural_check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Parse health email script and WHO UTC slots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/daily_task_health_email.py
          python3 - <<'PYCHECK'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/daily_task_health_email.py')
          spec = importlib.util.spec_from_file_location('health_digest', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          slots = module.expected_who_slots()
          assert len(slots) == 2, slots
          assert slots[0].hour < 7 <= slots[1].hour < 10, slots
          print('Python syntax and two WHO UTC windows structurally valid')
          PYCHECK

      - name: Check TEST email configuration names without exposing values
        env:
          UK_AQ_HEALTH_EMAIL_TO: ${{ vars.UK_AQ_HEALTH_EMAIL_TO }}
          UK_AQ_HEALTH_EMAIL_FROM: ${{ vars.UK_AQ_HEALTH_EMAIL_FROM }}
          UK_AQ_HEALTH_EMAIL_SMTP_HOST: ${{ vars.UK_AQ_HEALTH_EMAIL_SMTP_HOST }}
          UK_AQ_HEALTH_EMAIL_SMTP_PORT: ${{ vars.UK_AQ_HEALTH_EMAIL_SMTP_PORT }}
          UK_AQ_HEALTH_EMAIL_SEND_ENABLED: ${{ vars.UK_AQ_HEALTH_EMAIL_SEND_ENABLED }}
          GOOGLE_SMTP_USERNAME: ${{ secrets.GOOGLE_SMTP_USERNAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          import os
          names = (
              'UK_AQ_HEALTH_EMAIL_TO',
              'UK_AQ_HEALTH_EMAIL_FROM',
              'UK_AQ_HEALTH_EMAIL_SMTP_HOST',
              'UK_AQ_HEALTH_EMAIL_SMTP_PORT',
              'GOOGLE_SMTP_USERNAME',
              'GOOGLE_OAUTH_CLIENT_ID',
              'GOOGLE_OAUTH_CLIENT_SECRET',
              'GOOGLE_OAUTH_REFRESH_TOKEN',
          )
          for name in names:
              print(name + ": " + ("present" if os.environ.get(name, "").strip() else "MISSING"))
          print("Delivery is " + (
              "explicitly enabled" if os.environ.get('UK_AQ_HEALTH_EMAIL_SEND_ENABLED', '').lower() == 'true'
              else "disabled (safe default)"
          ))
          PYCHECK
