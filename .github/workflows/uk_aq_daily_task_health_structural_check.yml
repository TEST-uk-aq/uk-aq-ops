name: UK AQ Daily Task Health Structural Check

on:
  push:
    branches:
      - main
    paths:
      - "scripts/daily_task_health_email.py"
      - ".github/workflows/uk_aq_daily_task_health_email.yml"
      - ".github/workflows/uk_aq_daily_task_health_structural_check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Parse health email script and WHO UTC slots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/daily_task_health_email.py
          python3 - <<'PYCHECK'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/daily_task_health_email.py')
          spec = importlib.util.spec_from_file_location('health_digest', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          slots = module.expected_who_slots()
          assert len(slots) == 2, slots
          assert slots[0].hour < 7 <= slots[1].hour < 10, slots
          print('Python syntax and two WHO UTC windows structurally valid')
          PYCHECK

  preview:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OBS_AQIDB_SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
      OBS_AQIDB_SECRET_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
      UK_AQ_OPS_SCHEMA: ${{ vars.UK_AQ_OPS_SCHEMA || 'uk_aq_ops' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read real TEST records and render both reports without sending
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/daily_task_health_email.py --report-type morning
          mkdir -p tmp/daily_task_health_email_preview/morning
          cp tmp/daily_task_health_email/report.* tmp/daily_task_health_email_preview/morning/
          python3 scripts/daily_task_health_email.py --report-type supplement
          mkdir -p tmp/daily_task_health_email_preview/supplement
          cp tmp/daily_task_health_email/report.* tmp/daily_task_health_email_preview/supplement/
      - name: Retain private preview artefacts
        uses: actions/upload-artifact@v6
        with:
          name: uk-aq-health-email-two-window-test-preview
          path: tmp/daily_task_health_email_preview/
          if-no-files-found: error
          retention-days: 2

