name: Substack Phase 2 Cloudflare Browser Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/substack_phase2_probe_test.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID || vars.UK_AQ_CACHE_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN || secrets.UK_AQ_CACHE_CLOUDFLARE_API_TOKEN || '' }}
      WORKER_NAME: uk-aq-substack-probe-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Deploy temporary Browser Run probe Worker
        working-directory: workers/substack_phase2_probe_test
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --name "$WORKER_NAME"

      - name: Resolve workers.dev hostname
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')"
          test -n "$SUBDOMAIN"
          test "$SUBDOMAIN" != "null"
          printf 'WORKER_BASE=https://%s.%s.workers.dev\n' "$WORKER_NAME" "$SUBDOMAIN" >> "$GITHUB_ENV"
          echo "worker_base=https://$WORKER_NAME.$SUBDOMAIN.workers.dev"

      - name: Wait for temporary Worker availability
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/health.body" --write-out '%{http_code}' "$WORKER_BASE/health" || true)"
            echo "health attempt $attempt status=$code"
            if [ "$code" = "200" ]; then
              cat "$RUNNER_TEMP/health.body"
              exit 0
            fi
            sleep 5
          done
          echo "Temporary Worker never became available"
          exit 1

      - name: Probe feed through Browser Run
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error \
            --dump-header "$RUNNER_TEMP/feed.headers" \
            --output "$RUNNER_TEMP/feed.html" \
            --write-out '%{http_code}' \
            "$WORKER_BASE/feed-browser" || true)"
          echo "status=$code"
          grep -Ei '^(HTTP/|content-type:|x-browser-ms-used:|x-uk-aq-probe-source:|server:|cf-ray:)' "$RUNNER_TEMP/feed.headers" || true
          echo "feed_bytes=$(wc -c < "$RUNNER_TEMP/feed.html" | tr -d ' ')"
          echo -n "feed_prefix="
          head -c 800 "$RUNNER_TEMP/feed.html" | tr '\n\r' '  ' || true
          echo
          if [ "$code" != "200" ]; then
            exit 1
          fi

      - name: Probe article through Browser Run
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error \
            --dump-header "$RUNNER_TEMP/post.headers" \
            --output "$RUNNER_TEMP/post.html" \
            --write-out '%{http_code}' \
            "$WORKER_BASE/post-browser" || true)"
          echo "status=$code"
          grep -Ei '^(HTTP/|content-type:|x-browser-ms-used:|x-uk-aq-probe-source:|server:|cf-ray:)' "$RUNNER_TEMP/post.headers" || true
          echo "post_bytes=$(wc -c < "$RUNNER_TEMP/post.html" | tr -d ' ')"
          echo -n "post_prefix="
          head -c 800 "$RUNNER_TEMP/post.html" | tr '\n\r' '  ' || true
          echo
          if [ "$code" != "200" ]; then
            exit 1
          fi

          export POST_FILE="$RUNNER_TEMP/post.html"
          python - <<'PY'
          import html
          import os
          import re

          doc = open(os.environ["POST_FILE"], encoding="utf-8", errors="replace").read()

          def meta(attr, key):
              pats = [
                  rf'<meta\b[^>]*\b{attr}=["\']{re.escape(key)}["\'][^>]*\bcontent=["\']([^"\']*)["\'][^>]*>',
                  rf'<meta\b[^>]*\bcontent=["\']([^"\']*)["\'][^>]*\b{attr}=["\']{re.escape(key)}["\'][^>]*>',
              ]
              for pat in pats:
                  m = re.search(pat, doc, flags=re.I)
                  if m:
                      return html.unescape(m.group(1))
              return ""

          def canonical():
              for pat in [
                  r'<link\b[^>]*\brel=["\']canonical["\'][^>]*\bhref=["\']([^"\']+)["\']',
                  r'<link\b[^>]*\bhref=["\']([^"\']+)["\'][^>]*\brel=["\']canonical["\']',
              ]:
                  m = re.search(pat, doc, flags=re.I)
                  if m:
                      return html.unescape(m.group(1))
              return ""

          print("=== POST META ===")
          print("canonical=", canonical())
          for attr, key in [
              ("property", "og:title"),
              ("property", "og:description"),
              ("property", "og:image"),
              ("property", "og:image:width"),
              ("property", "og:image:height"),
              ("name", "twitter:card"),
              ("name", "twitter:title"),
              ("name", "twitter:description"),
              ("name", "twitter:image"),
          ]:
              print(f"{key}=", meta(attr, key))
          PY

      - name: Delete temporary probe Worker
        if: always()
        working-directory: workers/substack_phase2_probe_test
        run: |
          npx --yes wrangler@4 delete --name "$WORKER_NAME" --force || true
