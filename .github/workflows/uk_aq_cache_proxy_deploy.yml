name: Deploy uk_aq_cache_proxy Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_cache_proxy/**"
      - "workers/shared/uk_aq_history_cache.mjs"
      - "config/uk_aq_history_cache.json"
      - ".github/workflows/uk_aq_cache_proxy_deploy.yml"
  workflow_dispatch:
    inputs:
      station_history_service_override:
        description: "Optional STATION_HISTORY target confirmation; must match the persistent index authority"
        required: false
        default: ""
        type: string
      activate_compressed_chart_history:
        description: "Opt in to the TEST compressed-chart service binding after its private Worker exists"
        required: false
        default: false
        type: boolean
      diagnose_sleepercar_only:
        description: "Check Sleepercar HTTP authentication only; deliberately abort before any Worker deployment"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      UK_AQ_CACHE_WORKER_NAME: ${{ vars.UK_AQ_CACHE_WORKER_NAME || 'uk-aq-cache-proxy' }}
      UK_AQ_STATION_HISTORY_WORKER_NAME: ${{ vars.UK_AQ_STATION_HISTORY_WORKER_NAME || '' }}
      UK_AQ_ENV_NAME: ${{ vars.UK_AQ_ENV_NAME || '' }}
      UK_AQ_R2_HISTORY_VERSION: ${{ vars.UK_AQ_R2_HISTORY_VERSION || '' }}
      UK_AQ_MEDIA_PUBLIC_URL: ${{ vars.UK_AQ_MEDIA_PUBLIC_URL || '' }}
      STATION_HISTORY_SERVICE_OVERRIDE: ${{ inputs.station_history_service_override || '' }}
      UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID || vars.UK_AQ_CACHE_CLOUDFLARE_ACCOUNT_ID || '' }}
      UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN || secrets.UK_AQ_CACHE_CLOUDFLARE_API_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate cache deployment identity and Cloudflare credentials
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY_OWNER}" = "TEST-uk-aq" ] && [ "${UK_AQ_ENV_NAME}" != "TEST" ]; then
            echo "TEST history cache cut-over requires UK_AQ_ENV_NAME=TEST."; exit 1
          fi
          if [ -z "${UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN}" ]; then
            echo "Missing secret UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN (or legacy UK_AQ_CACHE_CLOUDFLARE_API_TOKEN)."
            exit 1
          fi
          if [ -z "${UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Missing variable UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID (or legacy UK_AQ_CACHE_CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
          if [ -z "${UK_AQ_STATION_HISTORY_WORKER_NAME}" ]; then
            echo "Missing required GitHub repository variable UK_AQ_STATION_HISTORY_WORKER_NAME."
            exit 1
          fi
          case "${UK_AQ_R2_HISTORY_VERSION}" in
            v2|v3) ;;
            *)
              echo "UK_AQ_R2_HISTORY_VERSION must be the persistent v2 or v3 observation-history authority."
              exit 1
              ;;
          esac

      - name: Resolve STATION_HISTORY Service Binding target
        working-directory: workers/uk_aq_cache_proxy
        run: |
          set -euo pipefail
          STATION_HISTORY_SERVICE="$(
            bash ./resolve_station_history_service.sh \
              "${UK_AQ_STATION_HISTORY_WORKER_NAME}" \
              "${UK_AQ_R2_HISTORY_VERSION}" \
              "${STATION_HISTORY_SERVICE_OVERRIDE}"
          )"
          RESOLVED_MEDIA_PUBLIC_URL="$(node <<'NODE'
          const value = String(process.env.UK_AQ_MEDIA_PUBLIC_URL || "").trim();
          let url;
          try {
            url = new URL(value);
          } catch (_error) {
            console.error("UK_AQ_MEDIA_PUBLIC_URL must be a non-empty HTTPS base URL.");
            process.exit(1);
          }
          if (
            url.protocol !== "https:"
            || !url.hostname
            || url.username
            || url.password
            || url.pathname !== "/"
            || url.search
            || url.hash
          ) {
            console.error("UK_AQ_MEDIA_PUBLIC_URL must be an HTTPS origin without credentials, path, query, or fragment.");
            process.exit(1);
          }
          process.stdout.write(url.origin);
          NODE
          )"
          echo "Resolved STATION_HISTORY Service Binding target: ${STATION_HISTORY_SERVICE}"
          printf 'STATION_HISTORY_SERVICE=%s\n' "${STATION_HISTORY_SERVICE}" >> "${GITHUB_ENV}"
          media_url_escaped="${RESOLVED_MEDIA_PUBLIC_URL//\\/\\\\}"
          media_url_escaped="${media_url_escaped//|/\\|}"
          media_url_escaped="${media_url_escaped//&/\\&}"
          sed \
            -e "s|__UK_AQ_STATION_HISTORY_WORKER_NAME__|${STATION_HISTORY_SERVICE}|g" \
            -e "s|__UK_AQ_MEDIA_PUBLIC_URL__|${media_url_escaped}|g" \
            wrangler.toml > wrangler.deploy.toml
          grep -F "service = \"${STATION_HISTORY_SERVICE}\"" wrangler.deploy.toml >/dev/null || {
            echo "Failed to resolve STATION_HISTORY Service Binding target."
            exit 1
          }
          if grep -q '__UK_AQ_STATION_HISTORY_WORKER_NAME__' wrangler.deploy.toml; then
            echo "Unresolved STATION_HISTORY Service Binding placeholder."
            exit 1
          fi
          if grep -q '__UK_AQ_MEDIA_PUBLIC_URL__' wrangler.deploy.toml; then
            echo "Unresolved UK_AQ_MEDIA_PUBLIC_URL placeholder."
            exit 1
          fi

      - name: Verify and enable optional Sleepercar compressed-chart HTTPS upstream
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.activate_compressed_chart_history || inputs.diagnose_sleepercar_only) }}
        working-directory: workers/uk_aq_cache_proxy
        env:
          PILOT_ORIGIN: ${{ vars.UK_AQ_COMPRESSED_CHART_UPSTREAM_URL || '' }}
          PILOT_ACCESS_ID: ${{ secrets.UK_AQ_COMPRESSED_CHART_ACCESS_CLIENT_ID || '' }}
          PILOT_ACCESS_SECRET: ${{ secrets.UK_AQ_COMPRESSED_CHART_ACCESS_CLIENT_SECRET || '' }}
          PILOT_UPSTREAM_SECRET: ${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET || '' }}
        run: |
          set -euo pipefail
          if [ -z "${PILOT_ORIGIN}" ] || [ -z "${PILOT_ACCESS_ID}" ] ||
             [ -z "${PILOT_ACCESS_SECRET}" ] || [ -z "${PILOT_UPSTREAM_SECRET}" ]; then
            echo "Sleepercar origin, Access service token and TEST upstream secret must be configured."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const raw = process.env.PILOT_ORIGIN || "";
          let u;
          try { u = new URL(raw); } catch { process.exit(1); }
          if (u.protocol !== "https:" || !/^[a-z0-9-]+\.sleepercar\.co\.uk$/.test(u.hostname)
            || u.port || u.pathname !== "/" || u.search || u.hash || u.username || u.password) {
            console.error("Pilot origin must be a clean HTTPS Sleepercar TEST subdomain.");
            process.exit(1);
          }
          NODE
          # This read-only probe is run only after the private Worker, Access
          # service policy and approved v3 sample are actually deployed.
          http_code="$(curl --silent --show-error --max-time 20 --connect-timeout 10 \
            --output "${RUNNER_TEMP}/uk_aq_chart_history_prototype_manifest.json" \
            --dump-header "${RUNNER_TEMP}/uk_aq_chart_history_prototype_headers.txt" \
            --write-out '%{http_code}|%{content_type}' \
            --header "CF-Access-Client-Id: ${PILOT_ACCESS_ID}" \
            --header "CF-Access-Client-Secret: ${PILOT_ACCESS_SECRET}" \
            --header "X-UK-AQ-Upstream-Auth: ${PILOT_UPSTREAM_SECRET}" \
            --header "Accept: application/json" \
            "${PILOT_ORIGIN}/v1/manifest?sample=v3-september-2026")"
          # Safe diagnostics: classify rejected responses without printing the
          # Access credentials, upstream secret, response body or any headers.
          http_status="${http_code%%|*}"
          content_type="${http_code#*|}"
          if [ "${http_status}" != "200" ]; then
            case "${content_type}" in
              application/json*)
                error_code="$(jq -r '.error.code // "unknown_json_error"' \
                  "${RUNNER_TEMP}/uk_aq_chart_history_prototype_manifest.json" 2>/dev/null || echo "invalid_json")"
                case "${error_code}" in
                  forbidden|pilot_not_configured|pilot_publication_unavailable|pilot_sample_invalid|pilot_query_invalid|method_not_allowed|route_not_found)
                    echo "Sleepercar preflight rejected: HTTP ${http_status}; Worker JSON error ${error_code}."
                    ;;
                  *) echo "Sleepercar preflight rejected: HTTP ${http_status}; unrecognised JSON error." ;;
                esac
                ;;
              *)
                # Safe, fixed-category HTML inspection. Never print the response
                # body or arbitrary headers; CF-Ray alone helps trace an edge block.
                response_file="${RUNNER_TEMP}/uk_aq_chart_history_prototype_manifest.json"
                header_file="${RUNNER_TEMP}/uk_aq_chart_history_prototype_headers.txt"
                if grep -qi '^cf-mitigated: *challenge' "${header_file}"; then
                  origin_category="cloudflare_challenge"
                elif grep -Eqi 'error[[:space:]]*1020|error code:[[:space:]]*1020' "${response_file}"; then
                  origin_category="cloudflare_rule_1020"
                elif grep -Eqi 'cloudflare access|access denied' "${response_file}"; then
                  origin_category="access_or_firewall_denial"
                elif grep -Eqi 'just a moment|checking your browser|cf-chl' "${response_file}"; then
                  origin_category="cloudflare_challenge_page"
                else
                  origin_category="unclassified_html"
                fi
                ray="$(awk 'tolower($1) == "cf-ray:" {gsub(/\\r/, "", $2); print $2; exit}' "${header_file}")"
                echo "Sleepercar preflight rejected: HTTP ${http_status}; response type ${content_type:-unknown}; category ${origin_category}; CF-Ray ${ray:-unavailable}."
                ;;
            esac
            exit 1
          fi
          jq -e '.schema_version == 1 and .sample_id == "v3-september-2026"
            and .source_generation == "v3" and .identity.connector_id == 1
            and .identity.station_id == 248 and .identity.timeseries_id == 212
            and .identity.pollutant_code == "pm25"' \
            "${RUNNER_TEMP}/uk_aq_chart_history_prototype_manifest.json" >/dev/null || {
            echo "Sleepercar pilot returned unexpected manifest identity."
            exit 1
          }
          if [ "${{ inputs.diagnose_sleepercar_only }}" = "true" ]; then
            echo "Sleepercar preflight succeeded; diagnostic-only run stops before any deployment."
            exit 1
          fi
          sed -i 's/^UK_AQ_COMPRESSED_CHART_ENABLED = "false"$/UK_AQ_COMPRESSED_CHART_ENABLED = "true"/' wrangler.deploy.toml
          grep -Fx 'UK_AQ_COMPRESSED_CHART_ENABLED = "true"' wrangler.deploy.toml >/dev/null
          echo "Validated Sleepercar pilot; HTTPS proxy enabled for this explicit deployment."

      - name: Validate required Worker secrets and vars
        run: |
          set -euo pipefail
          missing_secrets=()
          missing_vars=()
          [ -z "${{ secrets.UK_AQ_EDGE_ACCESS_TOKEN_SECRET }}" ] && missing_secrets+=("UK_AQ_EDGE_ACCESS_TOKEN_SECRET")
          [ -z "${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}" ]     && missing_secrets+=("UK_AQ_EDGE_UPSTREAM_SECRET")
          [ -z "${{ secrets.UK_AQ_CACHE_BYPASS_SECRET }}" ]      && missing_secrets+=("UK_AQ_CACHE_BYPASS_SECRET")
          [ -z "${{ secrets.UK_AQ_TURNSTILE_SECRET_KEY }}" ]     && missing_secrets+=("UK_AQ_TURNSTILE_SECRET_KEY")
          [ -z "${{ secrets.OBS_AQIDB_SECRET_KEY }}" ]           && missing_secrets+=("OBS_AQIDB_SECRET_KEY")
          [ -z "${{ secrets.SB_PUBLISHABLE_DEFAULT_KEY }}" ]     && missing_secrets+=("SB_PUBLISHABLE_DEFAULT_KEY")
          [ -z "${{ vars.UK_AQ_POSTCODE_LOOKUP_R2_API_URL }}" ]  && missing_vars+=("UK_AQ_POSTCODE_LOOKUP_R2_API_URL")
          [ -z "${{ vars.UK_AQ_POSTCODE_SUGGEST_R2_API_URL }}" ] && missing_vars+=("UK_AQ_POSTCODE_SUGGEST_R2_API_URL")
          [ -z "${{ vars.UK_AQ_LATEST_SNAPSHOT_R2_API_URL }}" ]  && missing_vars+=("UK_AQ_LATEST_SNAPSHOT_R2_API_URL")
          [ -z "${UK_AQ_MEDIA_PUBLIC_URL}" ]                    && missing_vars+=("UK_AQ_MEDIA_PUBLIC_URL")
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "Missing required GitHub secrets:"
            printf '  - %s\n' "${missing_secrets[@]}"
            exit 1
          fi
          if [ ${#missing_vars[@]} -gt 0 ]; then
            echo "Missing required GitHub variables:"
            printf '  - %s\n' "${missing_vars[@]}"
            exit 1
          fi

      - name: Prepare and validate Worker secrets payload
        working-directory: workers/uk_aq_cache_proxy
        env:
          PILOT_ORIGIN: ${{ vars.UK_AQ_COMPRESSED_CHART_UPSTREAM_URL || '' }}
          PILOT_ACCESS_ID: ${{ secrets.UK_AQ_COMPRESSED_CHART_ACCESS_CLIENT_ID || '' }}
          PILOT_ACCESS_SECRET: ${{ secrets.UK_AQ_COMPRESSED_CHART_ACCESS_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          umask 077
          secrets_json="$(jq -n \
            --arg UK_AQ_ENV_NAME "${{ vars.UK_AQ_ENV_NAME || '' }}" \
            --arg UK_AQ_R2_HISTORY_VERSION "${UK_AQ_R2_HISTORY_VERSION}" \
            --arg SUPABASE_URL "${{ vars.SUPABASE_URL }}" \
            --arg SB_PUBLISHABLE_DEFAULT_KEY "${{ secrets.SB_PUBLISHABLE_DEFAULT_KEY }}" \
            --arg SB_SECRET_KEY "${{ secrets.SB_SECRET_KEY }}" \
            --arg OBS_AQIDB_SUPABASE_URL "${{ vars.OBS_AQIDB_SUPABASE_URL }}" \
            --arg OBS_AQIDB_SECRET_KEY "${{ secrets.OBS_AQIDB_SECRET_KEY }}" \
            --arg UK_AQ_AQI_HISTORY_R2_API_URL "${{ vars.UK_AQ_AQI_HISTORY_R2_API_URL }}" \
            --arg UK_AQ_AQI_PROXY_HOURLY_GENERATION_ENABLED "${{ vars.UK_AQ_AQI_PROXY_HOURLY_GENERATION_ENABLED || 'false' }}" \
            --arg UK_AQ_AQI_MUTABLE_HOURS "${{ vars.UK_AQ_AQI_MUTABLE_HOURS || '120' }}" \
            --arg UK_AQ_OBSERVS_HISTORY_R2_API_URL "${{ vars.UK_AQ_OBSERVS_HISTORY_R2_API_URL }}" \
            --arg UK_AQ_LATEST_SNAPSHOT_R2_API_URL "${{ vars.UK_AQ_LATEST_SNAPSHOT_R2_API_URL }}" \
            --arg UK_AQ_POSTCODE_LOOKUP_R2_API_URL "${{ vars.UK_AQ_POSTCODE_LOOKUP_R2_API_URL }}" \
            --arg UK_AQ_POSTCODE_SUGGEST_R2_API_URL "${{ vars.UK_AQ_POSTCODE_SUGGEST_R2_API_URL }}" \
            --arg UK_AQ_CACHE_ALLOWED_ORIGINS "${{ vars.UK_AQ_CACHE_ALLOWED_ORIGINS }}" \
            --arg UK_AQ_EDGE_ACCESS_TOKEN_SECRET "${{ secrets.UK_AQ_EDGE_ACCESS_TOKEN_SECRET }}" \
            --arg UK_AQ_EDGE_UPSTREAM_SECRET "${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}" \
            --arg UK_AQ_CACHE_BYPASS_SECRET "${{ secrets.UK_AQ_CACHE_BYPASS_SECRET }}" \
            --arg UK_AQ_LOCAL_DEV_BYPASS_ENABLED "${{ vars.UK_AQ_LOCAL_DEV_BYPASS_ENABLED }}" \
            --arg UK_AQ_TURNSTILE_SECRET_KEY "${{ secrets.UK_AQ_TURNSTILE_SECRET_KEY }}" \
            --arg UK_AQ_EDGE_SESSION_MAX_AGE_SECONDS "${{ vars.UK_AQ_EDGE_SESSION_MAX_AGE_SECONDS }}" \
            --arg UK_AQ_CHART_METRICS_RPC "${{ vars.UK_AQ_CHART_METRICS_RPC }}" \
            --arg UK_AQ_CHART_METRICS_RATE_LIMIT_PER_MINUTE "${{ vars.UK_AQ_CHART_METRICS_RATE_LIMIT_PER_MINUTE }}" \
            --arg UK_AQ_CHART_METRICS_MAX_BODY_BYTES "${{ vars.UK_AQ_CHART_METRICS_MAX_BODY_BYTES }}" \
            --arg UK_AQ_TIMESERIES_V2_ENABLED "${{ vars.UK_AQ_TIMESERIES_V2_ENABLED }}" \
            --arg UK_AQ_TIMESERIES_PROXY_FIRST "${{ vars.UK_AQ_TIMESERIES_PROXY_FIRST }}" \
            --arg UK_AQ_TIMESERIES_R2_FIRST "${{ vars.UK_AQ_TIMESERIES_R2_FIRST }}" \
            --arg UK_AQ_TIMESERIES_ALLOW_INGEST_OVERWRITE "${{ vars.UK_AQ_TIMESERIES_ALLOW_INGEST_OVERWRITE }}" \
            --arg UK_AQ_TIMESERIES_MAX_WINDOW_DAYS "${{ vars.UK_AQ_TIMESERIES_MAX_WINDOW_DAYS }}" \
            --arg UK_AQ_TIMESERIES_MAX_R2_OBJECTS_PER_REQUEST "${{ vars.UK_AQ_TIMESERIES_MAX_R2_OBJECTS_PER_REQUEST }}" \
            --arg UK_AQ_TIMESERIES_MAX_SUPABASE_TAIL_HOURS "${{ vars.UK_AQ_TIMESERIES_MAX_SUPABASE_TAIL_HOURS }}" \
            --arg UK_AQ_TIMESERIES_INCREMENTAL_OVERLAP_MINUTES "${{ vars.UK_AQ_TIMESERIES_INCREMENTAL_OVERLAP_MINUTES }}" \
            --arg UK_AQ_TIMESERIES_PARTIAL_ON_R2_ERROR "${{ vars.UK_AQ_TIMESERIES_PARTIAL_ON_R2_ERROR }}" \
            --arg UK_AQ_TIMESERIES_PARTIAL_ON_INGEST_ERROR "${{ vars.UK_AQ_TIMESERIES_PARTIAL_ON_INGEST_ERROR }}" \
            --arg UK_AQ_TIMESERIES_RECENT_EDGE_TTL_SECONDS "${{ vars.UK_AQ_TIMESERIES_RECENT_EDGE_TTL_SECONDS }}" \
            --arg UK_AQ_TIMESERIES_RECENT_BROWSER_TTL_SECONDS "${{ vars.UK_AQ_TIMESERIES_RECENT_BROWSER_TTL_SECONDS }}" \
            --arg UK_AQ_TIMESERIES_RECENT_SWR_SECONDS "${{ vars.UK_AQ_TIMESERIES_RECENT_SWR_SECONDS }}" \
            --arg UK_AQ_TIMESERIES_HISTORICAL_EDGE_TTL_SECONDS "${{ vars.UK_AQ_TIMESERIES_HISTORICAL_EDGE_TTL_SECONDS }}" \
            --arg UK_AQ_TIMESERIES_HISTORICAL_BROWSER_TTL_SECONDS "${{ vars.UK_AQ_TIMESERIES_HISTORICAL_BROWSER_TTL_SECONDS }}" \
            --arg UK_AQ_TIMESERIES_HISTORICAL_SWR_SECONDS "${{ vars.UK_AQ_TIMESERIES_HISTORICAL_SWR_SECONDS }}" \
            --arg UK_AQ_TIMESERIES_STALE_IF_ERROR_SECONDS "${{ vars.UK_AQ_TIMESERIES_STALE_IF_ERROR_SECONDS }}" \
            --arg UK_AQ_STATION_HISTORY_STATION_SERIES_ENABLED "${{ vars.UK_AQ_STATION_HISTORY_STATION_SERIES_ENABLED || 'false' }}" \
            --arg UK_AQ_STATION_HISTORY_AQI_HISTORY_ENABLED "${{ vars.UK_AQ_STATION_HISTORY_AQI_HISTORY_ENABLED || 'false' }}" \
            --arg UK_AQ_STATION_HISTORY_TIMESERIES_ENABLED "${{ vars.UK_AQ_STATION_HISTORY_TIMESERIES_ENABLED || 'false' }}" \
            --arg UK_AQ_STATION_HISTORY_STALE_FALLBACK_ENABLED "${{ vars.UK_AQ_STATION_HISTORY_STALE_FALLBACK_ENABLED || 'false' }}" \
            --arg UK_AQ_STATION_HISTORY_RECENT_BUNDLE_FRESH_TTL_SECONDS "${{ vars.UK_AQ_STATION_HISTORY_RECENT_BUNDLE_FRESH_TTL_SECONDS || '60' }}" \
            --arg UK_AQ_STATION_HISTORY_RECENT_BUNDLE_MAX_STALE_SECONDS "${{ vars.UK_AQ_STATION_HISTORY_RECENT_BUNDLE_MAX_STALE_SECONDS || '300' }}" \
            --arg UK_AQ_STATION_HISTORY_MUTABLE_AQI_MAX_STALE_SECONDS "${{ vars.UK_AQ_STATION_HISTORY_MUTABLE_AQI_MAX_STALE_SECONDS || '300' }}" \
            --arg UK_AQ_STATION_HISTORY_MUTABLE_OBSERVATION_MAX_STALE_SECONDS "${{ vars.UK_AQ_STATION_HISTORY_MUTABLE_OBSERVATION_MAX_STALE_SECONDS || '300' }}" \
            --arg UK_AQ_STATION_HISTORY_IMMUTABLE_HISTORY_MAX_STALE_SECONDS "${{ vars.UK_AQ_STATION_HISTORY_IMMUTABLE_HISTORY_MAX_STALE_SECONDS || '604800' }}" \
            --arg DROPBOX_APP_KEY "${{ secrets.DROPBOX_APP_KEY }}" \
            --arg DROPBOX_APP_SECRET "${{ secrets.DROPBOX_APP_SECRET }}" \
            --arg DROPBOX_REFRESH_TOKEN "${{ secrets.DROPBOX_REFRESH_TOKEN }}" \
            --arg UK_AQ_DROPBOX_ROOT "${{ vars.UK_AQ_DROPBOX_ROOT }}" \
            --arg UK_AIR_ERROR_DROPBOX_FOLDER "${{ vars.UK_AIR_ERROR_DROPBOX_FOLDER }}" \
            --arg UK_AQ_WEBSITE_DEBUG_LOG_MAX_BODY_BYTES "${{ vars.UK_AQ_WEBSITE_DEBUG_LOG_MAX_BODY_BYTES }}" \
            '{UK_AQ_ENV_NAME:$UK_AQ_ENV_NAME, UK_AQ_R2_HISTORY_VERSION:$UK_AQ_R2_HISTORY_VERSION, SUPABASE_URL: $SUPABASE_URL, SB_PUBLISHABLE_DEFAULT_KEY: $SB_PUBLISHABLE_DEFAULT_KEY, SB_SECRET_KEY: $SB_SECRET_KEY, OBS_AQIDB_SUPABASE_URL: $OBS_AQIDB_SUPABASE_URL, OBS_AQIDB_SECRET_KEY: $OBS_AQIDB_SECRET_KEY, UK_AQ_AQI_HISTORY_R2_API_URL: $UK_AQ_AQI_HISTORY_R2_API_URL, UK_AQ_AQI_PROXY_HOURLY_GENERATION_ENABLED: $UK_AQ_AQI_PROXY_HOURLY_GENERATION_ENABLED, UK_AQ_AQI_MUTABLE_HOURS: $UK_AQ_AQI_MUTABLE_HOURS, UK_AQ_OBSERVS_HISTORY_R2_API_URL: $UK_AQ_OBSERVS_HISTORY_R2_API_URL, UK_AQ_LATEST_SNAPSHOT_R2_API_URL: $UK_AQ_LATEST_SNAPSHOT_R2_API_URL, UK_AQ_POSTCODE_LOOKUP_R2_API_URL: $UK_AQ_POSTCODE_LOOKUP_R2_API_URL, UK_AQ_POSTCODE_SUGGEST_R2_API_URL: $UK_AQ_POSTCODE_SUGGEST_R2_API_URL, UK_AQ_CACHE_ALLOWED_ORIGINS: $UK_AQ_CACHE_ALLOWED_ORIGINS, UK_AQ_EDGE_ACCESS_TOKEN_SECRET: $UK_AQ_EDGE_ACCESS_TOKEN_SECRET, UK_AQ_CACHE_BYPASS_SECRET: $UK_AQ_CACHE_BYPASS_SECRET, UK_AQ_LOCAL_DEV_BYPASS_ENABLED: $UK_AQ_LOCAL_DEV_BYPASS_ENABLED, UK_AQ_TURNSTILE_SECRET_KEY: $UK_AQ_TURNSTILE_SECRET_KEY, UK_AQ_EDGE_SESSION_MAX_AGE_SECONDS: $UK_AQ_EDGE_SESSION_MAX_AGE_SECONDS, UK_AQ_CHART_METRICS_RPC: $UK_AQ_CHART_METRICS_RPC, UK_AQ_CHART_METRICS_RATE_LIMIT_PER_MINUTE: $UK_AQ_CHART_METRICS_RATE_LIMIT_PER_MINUTE, UK_AQ_CHART_METRICS_MAX_BODY_BYTES: $UK_AQ_CHART_METRICS_MAX_BODY_BYTES, UK_AQ_TIMESERIES_V2_ENABLED: $UK_AQ_TIMESERIES_V2_ENABLED, UK_AQ_TIMESERIES_PROXY_FIRST: $UK_AQ_TIMESERIES_PROXY_FIRST, UK_AQ_TIMESERIES_R2_FIRST: $UK_AQ_TIMESERIES_R2_FIRST, UK_AQ_TIMESERIES_ALLOW_INGEST_OVERWRITE: $UK_AQ_TIMESERIES_ALLOW_INGEST_OVERWRITE, UK_AQ_TIMESERIES_MAX_WINDOW_DAYS: $UK_AQ_TIMESERIES_MAX_WINDOW_DAYS, UK_AQ_TIMESERIES_MAX_R2_OBJECTS_PER_REQUEST: $UK_AQ_TIMESERIES_MAX_R2_OBJECTS_PER_REQUEST, UK_AQ_TIMESERIES_MAX_SUPABASE_TAIL_HOURS: $UK_AQ_TIMESERIES_MAX_SUPABASE_TAIL_HOURS, UK_AQ_TIMESERIES_INCREMENTAL_OVERLAP_MINUTES: $UK_AQ_TIMESERIES_INCREMENTAL_OVERLAP_MINUTES, UK_AQ_TIMESERIES_PARTIAL_ON_R2_ERROR: $UK_AQ_TIMESERIES_PARTIAL_ON_R2_ERROR, UK_AQ_TIMESERIES_PARTIAL_ON_INGEST_ERROR: $UK_AQ_TIMESERIES_PARTIAL_ON_INGEST_ERROR, UK_AQ_TIMESERIES_RECENT_EDGE_TTL_SECONDS: $UK_AQ_TIMESERIES_RECENT_EDGE_TTL_SECONDS, UK_AQ_TIMESERIES_RECENT_BROWSER_TTL_SECONDS: $UK_AQ_TIMESERIES_RECENT_BROWSER_TTL_SECONDS, UK_AQ_TIMESERIES_RECENT_SWR_SECONDS: $UK_AQ_TIMESERIES_RECENT_SWR_SECONDS, UK_AQ_TIMESERIES_HISTORICAL_EDGE_TTL_SECONDS: $UK_AQ_TIMESERIES_HISTORICAL_EDGE_TTL_SECONDS, UK_AQ_TIMESERIES_HISTORICAL_BROWSER_TTL_SECONDS: $UK_AQ_TIMESERIES_HISTORICAL_BROWSER_TTL_SECONDS, UK_AQ_TIMESERIES_HISTORICAL_SWR_SECONDS: $UK_AQ_TIMESERIES_HISTORICAL_SWR_SECONDS, UK_AQ_TIMESERIES_STALE_IF_ERROR_SECONDS: $UK_AQ_TIMESERIES_STALE_IF_ERROR_SECONDS, UK_AQ_STATION_HISTORY_STATION_SERIES_ENABLED: $UK_AQ_STATION_HISTORY_STATION_SERIES_ENABLED, UK_AQ_STATION_HISTORY_AQI_HISTORY_ENABLED: $UK_AQ_STATION_HISTORY_AQI_HISTORY_ENABLED, UK_AQ_STATION_HISTORY_TIMESERIES_ENABLED: $UK_AQ_STATION_HISTORY_TIMESERIES_ENABLED, UK_AQ_STATION_HISTORY_STALE_FALLBACK_ENABLED: $UK_AQ_STATION_HISTORY_STALE_FALLBACK_ENABLED, UK_AQ_STATION_HISTORY_RECENT_BUNDLE_FRESH_TTL_SECONDS: $UK_AQ_STATION_HISTORY_RECENT_BUNDLE_FRESH_TTL_SECONDS, UK_AQ_STATION_HISTORY_RECENT_BUNDLE_MAX_STALE_SECONDS: $UK_AQ_STATION_HISTORY_RECENT_BUNDLE_MAX_STALE_SECONDS, UK_AQ_STATION_HISTORY_MUTABLE_AQI_MAX_STALE_SECONDS: $UK_AQ_STATION_HISTORY_MUTABLE_AQI_MAX_STALE_SECONDS, UK_AQ_STATION_HISTORY_MUTABLE_OBSERVATION_MAX_STALE_SECONDS: $UK_AQ_STATION_HISTORY_MUTABLE_OBSERVATION_MAX_STALE_SECONDS, UK_AQ_STATION_HISTORY_IMMUTABLE_HISTORY_MAX_STALE_SECONDS: $UK_AQ_STATION_HISTORY_IMMUTABLE_HISTORY_MAX_STALE_SECONDS, DROPBOX_APP_KEY: $DROPBOX_APP_KEY, DROPBOX_APP_SECRET: $DROPBOX_APP_SECRET, DROPBOX_REFRESH_TOKEN: $DROPBOX_REFRESH_TOKEN, UK_AQ_DROPBOX_ROOT: $UK_AQ_DROPBOX_ROOT, UK_AIR_ERROR_DROPBOX_FOLDER: $UK_AIR_ERROR_DROPBOX_FOLDER, UK_AQ_WEBSITE_DEBUG_LOG_MAX_BODY_BYTES: $UK_AQ_WEBSITE_DEBUG_LOG_MAX_BODY_BYTES} | with_entries(select(.value != ""))')"
          secrets_json="$(jq --arg value "${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}" '. + {UK_AQ_EDGE_UPSTREAM_SECRET: $value}' <<<"$secrets_json")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ inputs.activate_compressed_chart_history }}" = "true" ]; then
            secrets_json="$(jq \
              --arg origin "${PILOT_ORIGIN}" \
              --arg id "${PILOT_ACCESS_ID}" \
              --arg secret "${PILOT_ACCESS_SECRET}" \
              '. + {UK_AQ_COMPRESSED_CHART_UPSTREAM_URL: $origin,
                    UK_AQ_COMPRESSED_CHART_ACCESS_CLIENT_ID: $id,
                    UK_AQ_COMPRESSED_CHART_ACCESS_CLIENT_SECRET: $secret}' <<<"$secrets_json")"
          fi
          SECRETS_PAYLOAD_PATH="${RUNNER_TEMP}/uk_aq_cache_proxy_secrets.json"
          jq -e '
            if (type == "object" and length > 0 and all(.[]; type == "string"))
            then .
            else error("invalid Worker secrets payload")
            end
          ' <<<"$secrets_json" > "${SECRETS_PAYLOAD_PATH}"
          printf 'SECRETS_PAYLOAD_PATH=%s\n' "${SECRETS_PAYLOAD_PATH}" >> "${GITHUB_ENV}"

      - name: Validate Worker deployment package
        working-directory: workers/uk_aq_cache_proxy
        run: |
          set -euo pipefail
          npx --yes wrangler@4.130.0 deploy \
            --dry-run \
            --config wrangler.deploy.toml \
            --name "${UK_AQ_CACHE_WORKER_NAME}" \
            --outdir "${RUNNER_TEMP}/uk_aq_cache_proxy_dry_run"

      - name: Verify existing operational Workers
        working-directory: workers/uk_aq_cache_proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          verify_existing_worker() {
            local worker_name="$1"
            local role="$2"
            local versions_json="$3"
            if ! npx --yes wrangler@4.130.0 versions list \
              --config wrangler.deploy.toml \
              --name "${worker_name}" \
              --json > "${versions_json}"; then
              echo "${role} Worker ${worker_name} does not exist or cannot be inspected."
              echo "This operational workflow does not bootstrap Workers. Use a separately authorised bootstrap procedure."
              exit 1
            fi
            jq -e 'type == "array" and length > 0' "${versions_json}" >/dev/null || {
              echo "${role} Worker ${worker_name} has no deployed versions."
              echo "This operational workflow does not bootstrap Workers. Use a separately authorised bootstrap procedure."
              exit 1
            }
          }
          verify_existing_worker \
            "${UK_AQ_CACHE_WORKER_NAME}" \
            "Operational cache" \
            "${RUNNER_TEMP}/uk_aq_cache_proxy_versions.json"
          verify_existing_worker \
            "${STATION_HISTORY_SERVICE}" \
            "Authority-derived station-history target" \
            "${RUNNER_TEMP}/uk_aq_station_history_target_versions.json"

      - name: Apply Worker secrets to existing cache Worker
        working-directory: workers/uk_aq_cache_proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -f "${SECRETS_PAYLOAD_PATH}" || {
            echo "Validated Worker secrets payload is missing."
            exit 1
          }
          jq -e 'type == "object" and length > 0 and all(.[]; type == "string")' \
            "${SECRETS_PAYLOAD_PATH}" >/dev/null
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.130.0 secret bulk \
              "${SECRETS_PAYLOAD_PATH}" \
              --name "${UK_AQ_CACHE_WORKER_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to apply Worker secrets after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65
        with:
          apiToken: ${{ env.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/uk_aq_cache_proxy
          wranglerVersion: "4.130.0"
          command: deploy --config wrangler.deploy.toml --name ${{ env.UK_AQ_CACHE_WORKER_NAME }}

      - name: Report deployed STATION_HISTORY target
        run: |
          printf 'Deployed cache Worker: %s\n' "${UK_AQ_CACHE_WORKER_NAME}"
          printf 'Deployed STATION_HISTORY Service Binding target: %s\n' "${STATION_HISTORY_SERVICE}"
          printf 'Persistent observation-history authority: %s\n' "${UK_AQ_R2_HISTORY_VERSION}"
