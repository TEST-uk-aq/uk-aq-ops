name: Deploy UK AQ Ops Dashboard to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "station_snapshot/**"
      - "scripts/dashboard/**"
      - ".github/workflows/uk_aq_ops_dashboard_pages_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UK_AQ_CF_ACCOUNT_ID_UKAQ: ${{ vars.UK_AQ_CF_ACCOUNT_ID_UKAQ || vars.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID || '' }}
      UK_AQ_CF_API_TOKEN_UKAQ: ${{ secrets.UK_AQ_CF_API_TOKEN_UKAQ || secrets.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN || '' }}
      UK_AQ_OPS_DASHBOARD_PAGES_PROJECT: ${{ vars.UK_AQ_OPS_DASHBOARD_PAGES_PROJECT || '' }}
      UK_AQ_ENV_NAME: ${{ vars.UK_AQ_ENV_NAME }}
      UKAQ_API_BASE_URL: ${{ vars.UKAQ_API_BASE_URL || '/api' }}
      UKAQ_DASHBOARD_TITLE: ${{ vars.UKAQ_DASHBOARD_TITLE || 'UK AQ Dashboard (Test)' }}
      UKAQ_DASHBOARD_SUBTITLE: ${{ vars.UKAQ_DASHBOARD_SUBTITLE || 'Test dashboard on ukaq.co.uk' }}
      UKAQ_DEFAULT_REFRESH_SECONDS: ${{ vars.UKAQ_DEFAULT_REFRESH_SECONDS || '300' }}
      UKAQ_CONFIG_OUT_PATH: dashboard/assets/config.js
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Cloudflare settings
        run: |
          set -euo pipefail
          if [ -z "${UK_AQ_CF_API_TOKEN_UKAQ}" ]; then
            echo "Missing secret UK_AQ_CF_API_TOKEN_UKAQ (or fallback UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN)."
            exit 1
          fi
          if [ -z "${UK_AQ_CF_ACCOUNT_ID_UKAQ}" ]; then
            echo "Missing variable UK_AQ_CF_ACCOUNT_ID_UKAQ (or fallback UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
          if [ -z "${UK_AQ_ENV_NAME:-}" ]; then
            echo "Missing required GitHub Actions repository variable: UK_AQ_ENV_NAME"
            exit 1
          fi
          case "${UK_AQ_ENV_NAME}" in
            TEST|LIVE) ;;
            *)
              echo "UK_AQ_ENV_NAME must be exactly TEST or LIVE."
              exit 1
              ;;
          esac
          if [[ -z "${UK_AQ_OPS_DASHBOARD_PAGES_PROJECT//[[:space:]]/}" ]]; then
            echo "Missing variable UK_AQ_OPS_DASHBOARD_PAGES_PROJECT."
            exit 1
          fi

      - name: Generate browser-safe dashboard config
        run: |
          set -euo pipefail
          node scripts/dashboard/generate_dashboard_config.mjs

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _pages
          mkdir -p _pages/station_snapshot
          cp -R dashboard/. _pages/
          cp -R station_snapshot/. _pages/station_snapshot/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ env.UK_AQ_CF_API_TOKEN_UKAQ }}
          accountId: ${{ env.UK_AQ_CF_ACCOUNT_ID_UKAQ }}
          command: pages deploy _pages --project-name ${{ env.UK_AQ_OPS_DASHBOARD_PAGES_PROJECT }} --branch main
