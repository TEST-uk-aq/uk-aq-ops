name: Apply dashboard hierarchical Dropbox fix

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.title == 'internal: apply dashboard hierarchical Dropbox fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply hierarchical Dropbox coverage changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dashboard/_apply_hierarchical_dropbox_dashboard_fix.py
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("workers/uk_aq_dashboard_online_api_worker/src/lib/storage_coverage_http_enrichment.ts")
          text = path.read_text(encoding="utf-8")
          replacement = r'''async function fetchDropboxAccessToken(env: WorkerEnv): Promise<string> {
            const appKey = String(env.DROPBOX_APP_KEY || "").trim();
            const appSecret = String(env.DROPBOX_APP_SECRET || "").trim();
            const refreshToken = String(env.DROPBOX_REFRESH_TOKEN || "").trim();
            if (!appKey || !appSecret || !refreshToken) {
              throw new Error("Dropbox credentials are incomplete for hierarchical backup coverage");
            }
            const form = new URLSearchParams();
            form.set("grant_type", "refresh_token");
            form.set("refresh_token", refreshToken);
            form.set("client_id", appKey);
            form.set("client_secret", appSecret);
            const response = await fetch(DROPBOX_TOKEN_URL, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: form.toString(),
            });
            const text = await response.text();
            if (!response.ok) {
              throw new Error(`Dropbox token request failed (${response.status}): ${text.slice(0, 500)}`);
            }
            let payload: unknown = null;
            try {
              payload = text ? JSON.parse(text) : null;
            } catch (_error) {
              payload = null;
            }
            if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
              throw new Error("Dropbox token response is not a JSON object");
            }
            const token = String((payload as JsonObject).access_token || "").trim();
            if (!token) throw new Error("Dropbox token response missing access_token");
            return token;
          }'''
          pattern = re.compile(
              r"^async function fetchDropboxAccessToken\(env: WorkerEnv\): Promise<string> \{.*?(?=^async function fetchDropboxJson\()",
              re.MULTILINE | re.DOTALL,
          )
          text, count = pattern.subn(replacement.rstrip() + "\n\n", text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one TypeScript Dropbox token replacement, got {count}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Structural validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile local/dashboard/server/uk_aq_dashboard_api.py
          npm install --prefix workers/uk_aq_dashboard_online_api_worker --ignore-scripts --no-audit --no-fund
          npm --prefix workers/uk_aq_dashboard_online_api_worker run check
          git diff --check

      - name: Commit dashboard fix and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply_dashboard_hierarchical_dropbox_fix.yml
          git rm scripts/dashboard/_apply_hierarchical_dropbox_dashboard_fix.py
          git rm .github/_dashboard_fix_trigger.txt
          git add local/dashboard/server/uk_aq_dashboard_api.py
          git add workers/uk_aq_dashboard_online_api_worker/src/lib/storage_coverage_http_enrichment.ts
          git commit -m "Read hierarchical Dropbox backup state in dashboard"
          git push origin HEAD:${GITHUB_HEAD_REF}
