name: Apply observations global finaliser integration

on:
  push:
    branches:
      - main
    paths:
      - scripts/dev/_apply_observations_global_finalizer_phase.mjs
      - .github/workflows/_apply_observations_global_finalizer_phase.yml

permissions:
  contents: write

concurrency:
  group: apply-observations-global-finalizer-phase
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded caller patch
        run: node scripts/dev/_apply_observations_global_finalizer_phase.mjs

      - name: Check JavaScript structure
        run: |
          node --check workers/shared/uk_aq_r2_observations_global_finalizer.mjs
          node --check workers/uk_aq_prune_daily/phase_b_history_r2.mjs
          node --check workers/uk_aq_prune_daily/job.mjs
          node --check scripts/backup_r2/uk_aq_apply_integrity_proposal.mjs

      - name: Run focused hierarchy checks
        run: |
          node --test \
            tests/uk_aq_r2_observations_manifest_hierarchy.test.mjs \
            tests/uk_aq_observations_manifest_hierarchy_command.test.mjs \
            tests/uk_aq_r2_observations_manifest_hierarchy_finalizer.test.mjs \
            tests/uk_aq_r2_observations_global_finalizer.test.mjs \
            tests/uk_aq_prune_daily_hierarchy_integration.test.mjs

      - name: Commit guarded integration
        run: |
          git diff --check
          git rm -- \
            scripts/dev/_apply_observations_global_finalizer_phase.mjs \
            .github/workflows/_apply_observations_global_finalizer_phase.yml
          git add -- \
            workers/uk_aq_prune_daily/phase_b_history_r2.mjs \
            workers/uk_aq_prune_daily/job.mjs \
            scripts/backup_r2/uk_aq_apply_integrity_proposal.mjs \
            tests/uk_aq_prune_daily_hierarchy_integration.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No integration changes were produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: share observations global finalisation"
          git push origin HEAD:main
