name: Retire legacy latest cache route once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-legacy-latest-cache-once.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose legacy latest references
        shell: python
        run: |
          from pathlib import Path
          path = Path("workers/uk_aq_cache_proxy/src/index.ts")
          text = path.read_text()
          for n, line in enumerate(text.splitlines(), 1):
              if "uk_aq_latest" in line or 'latest:' in line:
                  print(f"{n}: {line}")
          raise SystemExit("diagnostic only")
