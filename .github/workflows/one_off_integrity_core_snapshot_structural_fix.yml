name: One-off Integrity core snapshot structural fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one_off_integrity_core_snapshot_structural_fix.yml
      - scripts/maintenance/apply_integrity_core_snapshot_structural_fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused source change
        run: python3 scripts/maintenance/apply_integrity_core_snapshot_structural_fix.py

      - name: Run focused structural checks
        run: |
          python3 -m py_compile scripts/uk-aq-history-integrity/bin/uk-aq-history-integrity_impl.py
          python3 -m py_compile scripts/uk-aq-history-integrity/tests/test_core_snapshot_structural_completeness.py
          python3 scripts/uk-aq-history-integrity/tests/test_core_snapshot_structural_completeness.py -v
          git diff --check

      - name: Commit focused fix
        run: |
          rm -f .github/workflows/one_off_integrity_core_snapshot_structural_fix.yml
          rm -f scripts/maintenance/apply_integrity_core_snapshot_structural_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Integrity core snapshot structural eligibility"
          git push origin HEAD:main
