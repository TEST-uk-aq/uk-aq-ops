name: UK AQ JSONgen Prune reader readiness (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uk-aq-jsongen-prune-reader-readiness
  cancel-in-progress: false

jobs:
  reader-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UK_AQ_ENV_NAME: ${{ vars.UK_AQ_ENV_NAME }}
      UK_AQ_GITHUB_REPO: ${{ vars.UK_AQ_GITHUB_REPO }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      UK_AQ_JSONGEN_PRUNE_READER_DB_URL: ${{ secrets.UK_AQ_JSONGEN_PRUNE_READER_DB_URL }}
    steps:
      - name: Checkout TEST Ops source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Configure officially obtained Supabase CA if supplied
        env:
          APPROVED_CA_PEM: ${{ secrets.UK_AQ_JSONGEN_SUPABASE_CA_PEM }}
        run: |
          set -euo pipefail
          if [ -n "$APPROVED_CA_PEM" ]; then
            printf '%s\n' "$APPROVED_CA_PEM" > "$RUNNER_TEMP/uk-aq-supabase-ca.pem"
            chmod 600 "$RUNNER_TEMP/uk-aq-supabase-ca.pem"
            printf 'NODE_EXTRA_CA_CERTS=%s\n' "$RUNNER_TEMP/uk-aq-supabase-ca.pem" >> "$GITHUB_ENV"
          fi

      - name: Verify independent private reader and bounded discovery
        run: |
          set -euo pipefail
          timeout --kill-after=5s 60s node --input-type=module <<'NODE'
          import pg from 'pg';
          import { connectPruneOutboxReader } from './scripts/jsongen/prune-outbox-reader.mjs';

          // Report fixed error categories only. Never print exception messages,
          // URLs, PostgreSQL identities, credentials, query text or row contents.
          function safeFailureCategory(error) {
            const code = typeof error?.code === 'string' ? error.code : '';
            const message = typeof error?.message === 'string' ? error.message : '';
            if (code === 'SELF_SIGNED_CERT_IN_CHAIN' || code === 'DEPTH_ZERO_SELF_SIGNED_CERT'
              || code === 'UNABLE_TO_VERIFY_LEAF_SIGNATURE'
              || code === 'UNABLE_TO_GET_ISSUER_CERT_LOCALLY'
              || code === 'CERT_HAS_EXPIRED' || code === 'ERR_TLS_CERT_ALTNAME_INVALID'
              || code.startsWith('ERR_TLS_')
              || /self.signed certificate|unable to verify.*certificate|certificate.*verify failed/i.test(message)) {
              return 'tls_certificate_verification';
            }
            if (code === '28P01' || code === '28000'
              || /password authentication failed|role .* does not exist|authentication failed/i.test(message)) {
              return 'postgres_authentication';
            }
            if (code === '08P01' || code === '0A000'
              || /unsupported startup parameter|invalid startup parameter/i.test(message)) {
              return 'pooler_or_postgres_startup';
            }
            if (code === 'ENOTFOUND' || code === 'EAI_AGAIN') return 'dns_resolution';
            if (['ETIMEDOUT', 'ECONNREFUSED', 'ECONNRESET', 'EHOSTUNREACH', 'ENETUNREACH'].includes(code)) {
              return 'network_connection';
            }
            if (code === '42501') return 'database_permission_denied';
            if (code === '42P01' || code === '3F000') return 'database_object_unavailable';
            if (code === '3D000') return 'database_name_rejected';
            return 'unclassified_connection_or_database_error';
          }

          // Observe the real reader attempt without bypassing its TEST identity
          // admission, strict TLS, read-only SQL or privilege enforcement.
          class DiagnosticClient extends pg.Client {
            async connect() {
              try {
                await super.connect();
                console.log('PASS: Verified-TLS database connection and login accepted.');
              } catch (error) {
                console.error('FAIL: TLS/authentication/startup:', safeFailureCategory(error));
                throw error;
              }
            }

            async query(...args) {
              const sql = typeof args[0] === 'string' ? args[0] : '';
              const stage = sql === 'BEGIN READ ONLY' ? 'read_only_transaction'
                : sql.startsWith("SELECT current_setting('transaction_read_only')")
                  ? 'reader_privilege_query'
                  : sql.includes('FROM uk_aq_ops.prune_jsongen_gate_acceptance_outbox')
                    ? 'bounded_outbox_query' : null;
              try {
                const result = await super.query(...args);
                if (stage === 'reader_privilege_query') {
                  console.log('PASS: Reader privilege query executed.');
                }
                return result;
              } catch (error) {
                if (stage) console.error('FAIL: ' + stage + ':', safeFailureCategory(error));
                throw error;
              }
            }
          }
          const required = [
            'UK_AQ_ENV_NAME', 'UK_AQ_GITHUB_REPO',
            'SUPABASE_URL', 'UK_AQ_JSONGEN_PRUNE_READER_DB_URL'
          ];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) {
            console.error('Reader configuration unavailable (variable names only):', missing.join(', '));
            process.exit(1);
          }
          let reader;
          try {
            // The existing reader checks TEST identity, verified TLS, group
            // inheritance, outbox RLS, read-only defaults and no writer rights.
            reader = await connectPruneOutboxReader({ Client: DiagnosticClient });
            const end = new Date();
            const start = new Date(end.valueOf() - 24 * 60 * 60 * 1000);
            const page = await reader.discover({
              from: start.toISOString(),
              to: end.toISOString(),
              limit: 1,
              mode: 'recent',
            });
            console.log('PASS: TEST JSONgen independent PostgreSQL reader accepted.');
            console.log('PASS: Bounded read-only outbox discovery accepted.');
            console.log('Events visible on first bounded page:', page.events.length);
            console.log('No receipts, R2 writes or canonical operations were performed.');
          } catch (error) {
            // Do not disclose PostgreSQL error strings, credentials, URLs or rows.
            const safeReaderCodes = new Set([
              'reader_configuration_required', 'unapproved_environment',
              'reader_privilege_rejected', 'outbox_connection_unavailable',
              'outbox_read_unavailable', 'invalid_discovery_window'
            ]);
            console.error('FAIL: Reader admission/verification:',
              safeReaderCodes.has(error?.code) ? error.code : 'reader_unavailable');
            process.exitCode = 1;
          } finally {
            if (reader) await reader.close().catch(() => {});
          }
          NODE
