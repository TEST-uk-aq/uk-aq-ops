name: UK AQ Supabase DB Dump Backup

on:
  workflow_dispatch:
    inputs:
      trigger_mode:
        description: "Trigger source supplied by the Cloudflare scheduler. Manual runs should keep the default."
        required: false
        default: "manual"
        type: string
      databases:
        description: "Optional database selection: ingestdb, obs_aqidb, or ingestdb,obs_aqidb. Blank backs up both."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: uk-aq-supabase-db-dump-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      UK_AQ_INGESTDB_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OBS_AQIDB_SUPABASE_DB_URL: ${{ secrets.OBS_AQIDB_SUPABASE_DB_URL }}
      OBS_AQIDB_SECRET_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      UK_AQ_DROPBOX_ROOT: ${{ vars.UK_AQ_DROPBOX_ROOT || '' }}
      UK_AQ_SUPABASE_DB_DUMP_BACKUP_DIR: ${{ vars.UK_AQ_SUPABASE_DB_DUMP_BACKUP_DIR || 'Supabase_Backup_db_dump' }}
      UK_AQ_SUPABASE_DB_DUMP_RETENTION_DAYS: ${{ vars.UK_AQ_SUPABASE_DB_DUMP_RETENTION_DAYS || '7' }}
      UK_AQ_DB_DUMP_SPLIT_LARGE_INSERTS: ${{ vars.UK_AQ_DB_DUMP_SPLIT_LARGE_INSERTS || 'true' }}
      UK_AQ_DB_DUMP_INSERT_SPLIT_THRESHOLD_ROWS: ${{ vars.UK_AQ_DB_DUMP_INSERT_SPLIT_THRESHOLD_ROWS || '10000' }}
      UK_AQ_DB_DUMP_INSERT_CHUNK_ROWS: ${{ vars.UK_AQ_DB_DUMP_INSERT_CHUNK_ROWS || '5000' }}
      OBS_AQIDB_SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL || '' }}
      UK_AQ_SUPABASE_DB_DUMP_TRIGGER_MODE: ${{ github.event.inputs.trigger_mode || 'manual' }}
      UK_AQ_SUPABASE_DB_DUMP_JOB_DATABASES: ${{ github.event.inputs.databases || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          source /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Install Supabase CLI 2.79.0
        run: |
          set -euo pipefail
          package_path="${RUNNER_TEMP}/supabase_2.79.0_linux_amd64.deb"
          curl -fsSL -o "${package_path}" \
            https://github.com/supabase/cli/releases/download/v2.79.0/supabase_2.79.0_linux_amd64.deb
          sudo apt-get install -y "${package_path}"
          supabase --version

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Validate required configuration
        run: |
          set -euo pipefail
          required_values=(
            UK_AQ_INGESTDB_DB_URL
            OBS_AQIDB_SUPABASE_DB_URL
            OBS_AQIDB_SECRET_KEY
            DROPBOX_APP_KEY
            DROPBOX_APP_SECRET
            DROPBOX_REFRESH_TOKEN
            UK_AQ_DROPBOX_ROOT
            OBS_AQIDB_SUPABASE_URL
          )
          missing=0
          for key in "${required_values[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required value: ${key}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          case "${UK_AQ_SUPABASE_DB_DUMP_TRIGGER_MODE}" in
            manual|scheduler) ;;
            *)
              echo "Unsupported trigger_mode input. Use manual or scheduler." >&2
              exit 2
              ;;
          esac

          case "${UK_AQ_SUPABASE_DB_DUMP_JOB_DATABASES}" in
            ""|ingestdb|obs_aqidb|ingestdb,obs_aqidb) ;;
            *)
              echo "Unsupported databases input. Use ingestdb, obs_aqidb, ingestdb,obs_aqidb, or leave blank." >&2
              exit 2
              ;;
          esac

      - name: Run Supabase database dump backup
        run: node workers/uk_aq_supabase_db_dump_backup_service/job.mjs
