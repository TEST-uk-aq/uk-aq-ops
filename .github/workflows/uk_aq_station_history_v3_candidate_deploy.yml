name: Deploy v3 station-history candidate Worker

on:
  workflow_dispatch:
    inputs:
      observations_candidate_url:
        description: "Exact authenticated workers.dev URL of uk-aq-observs-history-r2-api-v3-candidate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-candidate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID || vars.UK_AQ_CACHE_CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN || secrets.UK_AQ_CACHE_CLOUDFLARE_API_TOKEN || '' }}
      CANDIDATE_WORKER_NAME: uk-aq-station-history-v3-candidate
      CANDIDATE_OBSERVATIONS_URL: ${{ inputs.observations_candidate_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Validate isolated candidate configuration
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing Cloudflare account ID."; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing Cloudflare API token."; exit 1; }
          test -n "${CANDIDATE_OBSERVATIONS_URL}" || { echo "Missing observations_candidate_url workflow input."; exit 1; }
          case "${CANDIDATE_OBSERVATIONS_URL}" in
            https://uk-aq-observs-history-r2-api-v3-candidate.*.workers.dev) ;;
            *) echo "Candidate observations URL is not the fixed v3 candidate Worker."; exit 1 ;;
          esac
          test -n "${{ vars.SUPABASE_URL }}" || { echo "Missing SUPABASE_URL."; exit 1; }
          test -n "${{ secrets.SB_SECRET_KEY }}" || { echo "Missing SB_SECRET_KEY."; exit 1; }
          test -n "${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}" || { echo "Missing UK_AQ_EDGE_UPSTREAM_SECRET."; exit 1; }
          test -n "${{ vars.UK_AQ_AQI_HISTORY_R2_API_URL }}" || { echo "Missing UK_AQ_AQI_HISTORY_R2_API_URL."; exit 1; }
      - name: Reuse existing station-history secrets and vars
        working-directory: workers/uk_aq_station_history_v3_candidate
        run: |
          set -euo pipefail
          jq -n \
            --arg SUPABASE_URL "${{ vars.SUPABASE_URL }}" \
            --arg SB_SECRET_KEY "${{ secrets.SB_SECRET_KEY }}" \
            --arg UK_AQ_PUBLIC_SCHEMA "${{ vars.UK_AQ_PUBLIC_SCHEMA || 'uk_aq_public' }}" \
            --arg INGESTDB_RETENTION_DAYS "${{ vars.INGESTDB_RETENTION_DAYS || '5' }}" \
            --arg UK_AQ_EDGE_UPSTREAM_SECRET "${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}" \
            --arg UK_AQ_AQI_HISTORY_R2_API_URL "${{ vars.UK_AQ_AQI_HISTORY_R2_API_URL }}" \
            --arg UK_AQ_OBSERVS_HISTORY_R2_API_URL "${CANDIDATE_OBSERVATIONS_URL}" \
            --arg UK_AQ_STATION_HISTORY_CONTINUITY_ENABLED "${{ vars.UK_AQ_STATION_HISTORY_CONTINUITY_ENABLED || 'false' }}" \
            --arg UK_AQ_STATION_HISTORY_CALCULATED_HISTORY_AQI_ENABLED "${{ vars.UK_AQ_STATION_HISTORY_CALCULATED_HISTORY_AQI_ENABLED || 'false' }}" \
            --arg UK_AQ_STATION_HISTORY_AQI_VALIDATION_MODE "${{ vars.UK_AQ_STATION_HISTORY_AQI_VALIDATION_MODE || 'off' }}" \
            --arg UK_AQ_STATION_HISTORY_AQI_VALIDATION_SAMPLE_PERCENT "${{ vars.UK_AQ_STATION_HISTORY_AQI_VALIDATION_SAMPLE_PERCENT || '0' }}" \
            '{SUPABASE_URL:$SUPABASE_URL,SB_SECRET_KEY:$SB_SECRET_KEY,UK_AQ_PUBLIC_SCHEMA:$UK_AQ_PUBLIC_SCHEMA,INGESTDB_RETENTION_DAYS:$INGESTDB_RETENTION_DAYS,UK_AQ_EDGE_UPSTREAM_SECRET:$UK_AQ_EDGE_UPSTREAM_SECRET,UK_AQ_AQI_HISTORY_R2_API_URL:$UK_AQ_AQI_HISTORY_R2_API_URL,UK_AQ_OBSERVS_HISTORY_R2_API_URL:$UK_AQ_OBSERVS_HISTORY_R2_API_URL,UK_AQ_STATION_HISTORY_CONTINUITY_ENABLED:$UK_AQ_STATION_HISTORY_CONTINUITY_ENABLED,UK_AQ_STATION_HISTORY_CALCULATED_HISTORY_AQI_ENABLED:$UK_AQ_STATION_HISTORY_CALCULATED_HISTORY_AQI_ENABLED,UK_AQ_STATION_HISTORY_AQI_VALIDATION_MODE:$UK_AQ_STATION_HISTORY_AQI_VALIDATION_MODE,UK_AQ_STATION_HISTORY_AQI_VALIDATION_SAMPLE_PERCENT:$UK_AQ_STATION_HISTORY_AQI_VALIDATION_SAMPLE_PERCENT}' \
            | npx --yes wrangler@4 secret bulk --name "${CANDIDATE_WORKER_NAME}"
      - name: Deploy private non-authoritative candidate
        working-directory: workers/uk_aq_station_history_v3_candidate
        run: npx --yes wrangler@4 deploy --name "${CANDIDATE_WORKER_NAME}"
