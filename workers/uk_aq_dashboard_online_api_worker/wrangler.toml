name = "uk-aq-ops-dashboard-api"
main = "src/index.ts"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
# Redact subscriber search parameters from logged request URLs.
enabled = true
redact_query_string = true

[vars]
UKAQ_PROXY_ROUTE_PREFIX = "/api"
# DASHBOARD_UPSTREAM_BASE_URL = "https://example.internal"

[[routes]]
pattern = "__UK_AQ_OPS_ADMIN_HOSTNAME__/api/*"
zone_name = "__UK_AQ_OPS_ADMIN_ZONE_NAME__"
