name = "uk-aq-station-history"
main = "src/index.mjs"
compatibility_date = "2026-07-15"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true

# No routes or custom domains: this Worker is reachable only through the
# uk-aq-cache-proxy STATION_HISTORY Service Binding.
# UK_AQ_RECENT_AQI_PROTOTYPE_ENABLED defaults to false and requires an
# explicitly configured UK_AQ_RECENT_AQI_PROTOTYPE_TIMESERIES_ID in TEST.
# The six-hour route also accepts UK_AQ_RECENT_HOURLY_PROTOTYPE_ALLOWLIST:
# bounded JSON entries with timeseries_id, connector_id=1 and pollutant.
