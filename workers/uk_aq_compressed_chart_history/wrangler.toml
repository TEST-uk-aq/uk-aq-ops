name = "uk-aq-compressed-chart-history-test"
main = "worker.mjs"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

# Intentionally no route or custom domain. Only the cache-proxy service binding calls this Worker.
# Replace this syntactically valid sentinel with the real private derived TEST bucket before deployment.
[[r2_buckets]]
binding = "UK_AQ_COMPRESSED_CHART_BUCKET"
bucket_name = "uk-aq-compressed-chart-unconfigured-test"

[vars]
UK_AQ_ENV_NAME = "TEST"

# Runtime secret: UK_AQ_EDGE_UPSTREAM_SECRET (same TEST service-binding secret as cache proxy).
