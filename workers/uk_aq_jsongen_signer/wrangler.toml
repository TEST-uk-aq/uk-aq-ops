name = "uk-aq-jsongen-signer-test"
main = "worker.mjs"
compatibility_date = "2026-10-12"
workers_dev = false
preview_urls = false

# No route, custom domain, deployment workflow or schedule is configured.
[vars]
UK_AQ_ENV_NAME = "TEST"
UK_AQ_JSONGEN_SIGNER_ENABLED = "false"
# Set only in a separately reviewed operator deployment config.
UK_AQ_JSONGEN_PRUNE_CONNECTOR_IDS = ""

# A native [[ratelimits]] binding is required before enablement. Its numeric
# namespace_id must first be allocated by the owning Cloudflare account;
# "1001" was an unverified example and is deliberately not reserved here.
# The Worker fails closed while the binding is absent. See README.md.
